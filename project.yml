name: Transeen
options:
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    MARKETING_VERSION: '0.7.0'
    CURRENT_PROJECT_VERSION: '10'
targets:
  Transeen:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transeen.app
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Transeen
schemes:
  Transeen:
    build:
      targets:
        Transeen: all
