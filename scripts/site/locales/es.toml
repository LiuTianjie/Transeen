[[guide.sections]]
id = "troubleshooting"
title = "Solución de problemas"
body = """
<h3>No pasa nada al pulsar F1</h3>
<p>En el teclado de un portátil, F1 cambia el brillo a menos que mantengas pulsada <kbd>fn</kbd> o actives «Usar las teclas F1, F2, etc. como teclas de función estándar» en Ajustes del Sistema → Teclado → Atajos de teclado → Teclas de función. También puede que otra app ocupe F1; Transeen te avisa cuando no puede registrar un atajo. Elige otra tecla en Ajustes → Atajos, o empieza desde <strong>Capturar y traducir</strong> en el menú de la barra de menús.</p>
<h3>La captura sale vacía o el permiso se pide una y otra vez</h3>
<p>Abre <strong>Permiso de pantalla…</strong> en el menú de la barra de menús. Si Ajustes del Sistema ya muestra Transeen activado, desactívalo y vuelve a activarlo, y luego elige <strong>Volver a abrir</strong>.</p>
<h3>Una parte de la ventana sale en negro</h3>
<p>Algunas apps protegen el vídeo y otros contenidos de la grabación de pantalla, y salen en negro en cualquier captura. Transeen no puede leer ni traducir esa parte; el resto del marco funciona con normalidad.</p>
<h3>La Traducción de Apple no empieza</h3>
<p>Puede que falte el paquete de idioma de ese par o que aún se esté descargando. Descárgalo en Ajustes → General → Traducción, o revisa Ajustes del Sistema → General → Idioma y región → Idiomas de traducción, y vuelve a intentarlo.</p>
<h3>El modelo local no se inicia</h3>
<p>Inténtalo otra vez. Si sigue fallando, elimina el modelo en Ajustes → General → Traducción y descárgalo de nuevo; una descarga que no supera la verificación se elimina sola.</p>
<h3>Parte del texto sale mal traducido</h3>
<p>Las maquetaciones densas, las fórmulas y los términos especializados pueden confundir al reconocimiento o a la traducción. Compara con el original (<kbd>Tab</kbd>), abre <strong>Texto</strong> para ver la traducción completa o selecciona una zona más pequeña.</p>
"""

[[guide.sections]]
id = "build"
title = "Compilar desde el código fuente"
body = """
<p>Transeen tiene <a href="https://github.com/LiuTianjie/Transeen/blob/main/LICENSE">licencia MIT</a>. Necesitas Xcode 26.4 o posterior, Swift 6 y XcodeGen.</p>
<pre><code>brew install xcodegen
git clone https://github.com/LiuTianjie/Transeen.git
cd Transeen
./scripts/build.sh</code></pre>
<p>La app se genera en <code>dist/Transeen.app</code>. Sin una identidad Developer ID, la compilación se firma ad hoc; define <code>TRANSEEN_SIGNING_IDENTITY</code> para obtener una compilación firmada. Las pruebas son <code>./scripts/test.sh</code>, <code>./scripts/test-license.sh</code> y <code>./scripts/test-lifecycle.sh</code>. El servicio de activación alojado pertenece a la app oficial, así que una distribución independiente necesita su propio servidor de licencias.</p>
"""
