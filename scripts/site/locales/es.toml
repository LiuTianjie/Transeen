[faq]
fig = "Preguntas"
lede = "<b>Preguntas.</b>"

[[faq.items]]
q = "¿Con qué apps funciona?"
a = "Con cualquier app que muestre texto en pantalla. Transeen traduce los píxeles que seleccionas, así que no necesita extensiones, y un marco puede abarcar varias apps. El vídeo protegido de la grabación de pantalla sale en negro, como en cualquier captura."

[[faq.items]]
q = "¿En qué Mac funciona?"
a = "En macOS 26 o posterior, con chip de Apple o Intel. Los modelos locales necesitan un chip de Apple."

[[faq.items]]
q = "¿Funciona sin conexión?"
a = "Sí, una vez activado y descargado el paquete de idioma o el modelo. Solo una API de LLM necesita conexión."

[[faq.items]]
q = "¿Qué sale de mi Mac?"
a = "Con la Traducción de Apple o un modelo local, nada. Con una API de LLM, solo el texto reconocido va a tu endpoint, nunca la captura."

[[faq.items]]
q = "¿Puedo usar otro modelo?"
a = "Sí: descarga Index-Translate 2B o Hy-MT2 1.8B en Ajustes, o introduce una API compatible con OpenAI. Las claves se guardan en tu llavero."

[[faq.items]]
q = "¿Puede traducir una imagen que ya tengo?"
a = "Sí. Pulsa <kbd>⌘O</kbd> y se abre con las mismas herramientas."

[[faq.items]]
q = "¿Qué precisión tiene?"
a = "Depende del servicio de traducción. Pulsa <kbd>Tab</kbd> para revisar el original antes de fiarte de un detalle."

[[faq.items]]
q = "¿Transeen es de código abierto?"
a = "Sí, con <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">licencia MIT</a>. La app oficial necesita un código TR-."

[[faq.items]]
q = "¿Cómo se actualiza?"
a = "Elige Buscar actualizaciones… en la barra de menús."

