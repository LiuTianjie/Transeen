[[guide.sections]]
id = "install"
title = "Instalar"
body = """
<ol>
  <li>Descarga el DMG más reciente de <a href="https://github.com/LiuTianjie/Transeen/releases/latest">GitHub Releases</a>. Ocupa unos {about} MB y es una sola app universal para chip de Apple e Intel.</li>
  <li>Abre el DMG y arrastra Transeen a Aplicaciones.</li>
  <li>Abre Transeen desde Aplicaciones. Vive en la barra de menús, así que busca su icono allí y no en el Dock.</li>
</ol>
<p>La app y el DMG están firmados con un Developer ID y notarizados por Apple, así que macOS los abre sin avisos. En la misma página hay un ZIP y sumas de verificación SHA-256. La interfaz sigue el idioma de tu Mac: English, 简体中文, 繁體中文, 日本語, 한국어, Français, Español o Deutsch.</p>
"""

[[guide.sections]]
id = "activate"
title = "Activar"
body = """
<ol>
  <li>Elige <strong>Activación y cuenta…</strong> en el menú de la barra de menús, o <strong>Activar Transeen</strong> en la ventana de inicio.</li>
  <li>Introduce tu código, que tiene la forma <code>TR-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX</code>, y elige <strong>Activar este Mac</strong>. No hace falta iniciar sesión.</li>
  <li>Si quieres, inicia sesión en una cuenta de iTool con Google, GitHub o tu correo y vincula la licencia. Al iniciar sesión en la misma cuenta más adelante, se restaura.</li>
</ol>
<p>La activación guarda un ID de instalación aleatorio y un recibo en tu llavero; nunca lee el número de serie del Mac. Un código cubre un Mac, y vincular una cuenta no crea una segunda licencia. Los códigos SM- de StupidMirror e IT- de iTool Pro son de otros productos y no funcionan aquí. Para conseguir un código, <a href="https://github.com/LiuTianjie/Transeen/discussions">pregunta en GitHub Discussions</a>.</p>
"""

[[guide.sections]]
id = "permission"
title = "Permitir la grabación de pantalla"
body = """
<p>La primera vez que capturas, Transeen pide el permiso de grabación de pantalla. Solo usa la imagen de la pantalla, nunca el audio, y solo cuando pulsas un atajo de captura. No guarda historial ni graba nunca de forma continua.</p>
<ol>
  <li>Elige <strong>Abrir Ajustes del Sistema…</strong>, o ve a Ajustes del Sistema → Privacidad y seguridad → Grabación de pantalla y audio del sistema.</li>
  <li>Busca Transeen y actívalo.</li>
  <li>Vuelve a Transeen. Lo comprueba de nuevo por sí solo y muestra <strong>Todo listo</strong>; elige <strong>Seleccionar un área</strong> para continuar.</li>
</ol>
<p>Si está activado pero sigue sin funcionar, usa <strong>Comprobar de nuevo</strong> o <strong>Volver a abrir</strong> en la misma ventana.</p>
"""

[[guide.sections]]
id = "languages"
title = "Elegir idiomas"
body = """
<p>La ventana de inicio tiene dos menús, <strong>Idioma de origen</strong> e <strong>Idioma de destino</strong>. Deja el origen en <strong>Detección auto</strong> o elige uno de los ocho idiomas: chino simplificado, chino tradicional, inglés, japonés, coreano, francés, español y alemán. Cualquiera se traduce a cualquier otro.</p>
<p>Con una captura abierta, la dirección que aparece bajo las herramientas (por ejemplo JA → ES) cambia cualquiera de los dos idiomas, y al volver a pulsar <kbd>F1</kbd> se intercambian.</p>
<p>La Traducción de Apple necesita un paquete de idioma para cada par. La guía que se abre la primera vez, y después Ajustes → General → Traducción, muestran los paquetes de tu idioma de destino con su estado. <strong>Descargar</strong> obtiene uno antes de que tu primera captura lo necesite; a partir de ahí la traducción se hace en tu Mac, sin conexión. Los paquetes también aparecen en Ajustes del Sistema → General → Idioma y región → Idiomas de traducción.</p>
"""

[[guide.sections]]
id = "translate"
title = "Traducir una zona"
body = """
<ol>
  <li>En cualquier app, pulsa <kbd>F1</kbd>. La pantalla se congela y se oscurece. En el teclado de un portátil es <kbd>fn</kbd> <kbd>F1</kbd>, salvo que las teclas F funcionen como teclas de función estándar.</li>
  <li>Pasa el puntero para ajustarte a un párrafo, un campo o una ventana y haz clic, o dibuja tu propio marco. Un marco puede abarcar ventanas de varias apps. <kbd>Esc</kbd> o un clic derecho cancela.</li>
  <li>¿El mismo sitio que la última vez? Pulsa <kbd>R</kbd> mientras seleccionas y se toma de nuevo la zona de la última captura, incluso tras reiniciar.</li>
  <li>Lee la traducción donde estaba el texto. Las líneas aparecen a medida que se traducen. Pulsa <kbd>Tab</kbd> para cambiar al original y volver, o mantén pulsada la <kbd>barra espaciadora</kbd> para echarle un vistazo.</li>
  <li>¿Te faltó un trozo? Arrastra un borde o una esquina de la captura. Se recorta de nuevo a partir de la misma pantalla congelada, tus anotaciones se quedan en su sitio y se vuelve a traducir al soltar.</li>
  <li>¿Al revés? Pulsa <kbd>F1</kbd> otra vez con la captura abierta y los dos idiomas se intercambian.</li>
</ol>
<p>Transeen lee los píxeles de la pantalla, así que funciona igual en todas las apps, incluidas las de pantalla completa y en todos los Spaces, y un menú o una ayuda abiertos se quedan en la imagen. <kbd>F1</kbd> es el único atajo que funciona en cualquier app desde el primer momento. Para capturar y anotar sin traducir, elige <strong>Anotar</strong> en el menú de la barra de menús o asígnale una tecla en Ajustes → Atajos; pulsa <kbd>T</kbd> en esa ventana si al final quieres la traducción. Para traducir una imagen que ya tienes, elige <strong>Abrir imagen…</strong> o pulsa <kbd>⌘O</kbd>.</p>
"""

[[guide.sections]]
id = "mark"
title = "Anotar"
body = """
<p>Elige una herramienta en la barra de herramientas o pulsa su tecla: <kbd>R</kbd> para un rectángulo, <kbd>O</kbd> para una elipse, <kbd>A</kbd> para una flecha, <kbd>P</kbd> para el lápiz y <kbd>V</kbd> para seleccionar y mover. Una herramienta de dibujo siempre dibuja, aunque empieces sobre una anotación; usa <kbd>V</kbd> para coger una. Los números cuentan desde 1 y conservan su valor al deshacer y rehacer.</p>
<p>Elige uno de los seis colores y de los tres grosores, o abre los controles deslizantes para cualquier color y un grosor de 1 a 10. <kbd>⌘Z</kbd> y <kbd>⌘⇧Z</kbd> deshacen y rehacen; <kbd>Supr</kbd> elimina la anotación seleccionada. Las anotaciones tienen su propia capa, así que alternar entre original y traducción nunca las mueve.</p>
"""

[[guide.sections]]
id = "keep"
title = "Copiar, guardar o fijar"
body = """
<ul>
  <li><kbd>⌘C</kbd> copia la imagen tal como la ves, anotaciones incluidas, incluso mientras se está traduciendo. De forma predeterminada también cierra la captura; desactiva <strong>Cerrar la captura después de copiar</strong> en Ajustes para mantenerla abierta.</li>
  <li><kbd>⌘S</kbd> la guarda en PNG.</li>
  <li><strong>Fijar en pantalla</strong> deja la imagen en la pantalla como una ventana flotante propia y termina la captura, para que la siguiente empiece enseguida. Una captura fijada se queda encima de la app a la que cambies. Arrástrala adonde quieras y guarda tantas como necesites; haz clic derecho en una para copiarla, guardarla, alternar entre original y traducción o cerrarla.</li>
  <li><strong>Texto</strong> abre la traducción completa junto al original, lista para copiar.</li>
</ul>
"""

[[guide.sections]]
id = "model"
title = "Elegir un servicio de traducción"
body = """
<p>Abre Ajustes (<kbd>⌘,</kbd>) → General → Traducción y elige un <strong>Servicio de traducción</strong>. El reconocimiento de texto siempre ocurre en tu Mac.</p>
<h3>Traducción de Apple (en el dispositivo)</h3>
<p>La opción predeterminada. Usa los paquetes de idioma del paso 4, funciona sin conexión y no envía nada a ningún sitio. Las líneas se traducen en grupos de ocho, así que una captura larga se va completando mientras lees.</p>
<h3>Modelo de traducción local</h3>
<p>Descarga Index-Translate 2B o Hy-MT2 1.8B, de unos 1,1 GB cada uno. El modelo se ejecuta dentro de Transeen, sin cuenta, sin otra app y sin red. Necesita un Mac con chip de Apple. La primera traducción tarda unos segundos en cargar el modelo, y su memoria se libera tras cinco minutos sin uso. <strong>Eliminar modelo</strong> lo quita de nuevo.</p>
<h3>API de LLM</h3>
<p>Cualquier endpoint chat/completions compatible con OpenAI. Rellena:</p>
<ul>
  <li><strong>Endpoint</strong>, la URL completa, por ejemplo <code>https://api.openai.com/v1/chat/completions</code>;</li>
  <li><strong>Nombre del modelo</strong>;</li>
  <li>la clave de API, si el servicio la necesita, y después <strong>Guardar clave</strong>. Se guarda en tu llavero. <strong>Probar conexión</strong> la comprueba.</li>
</ul>
<p>También sirve un servidor en tu propio Mac: las direcciones locales pueden usar HTTP sin clave, por ejemplo <code>http://localhost:11434/v1/chat/completions</code> para Ollama. Las direcciones remotas deben usar HTTPS. Este modo solo envía el texto reconocido, nunca la captura. Si una solicitud falla, Transeen muestra el error y conserva la imagen original.</p>
"""

