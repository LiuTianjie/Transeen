[faq]
fig = "Preguntas"
lede = "<b>Preguntas.</b> Para cualquier otra cosa, pregunta en GitHub Discussions."

[[faq.items]]
q = "¿Con qué apps funciona?"
a = "Con cualquier app que muestre texto en pantalla: navegadores, chat y correo, lectores de PDF, juegos, herramientas de diseño y vídeo, escritorios remotos y máquinas virtuales. Transeen traduce los píxeles que seleccionas, así que no necesita extensiones ni que la app lo admita, y un mismo marco puede abarcar ventanas de varias apps. El vídeo que una app protege de la grabación de pantalla sale en negro, como en cualquier captura."

[[faq.items]]
q = "¿En qué Mac funciona Transeen?"
a = "En macOS 26 o posterior, con chip de Apple o Intel: es una sola app universal. Los modelos de traducción locales necesitan un chip de Apple. La interfaz sigue tu idioma: English, 简体中文, 繁體中文, 日本語, 한국어, Français, Español o Deutsch."

[[faq.items]]
q = "¿Funciona sin conexión?"
a = "Sí, una vez activado. La captura, la anotación, la Traducción de Apple y los modelos locales funcionan sin conexión cuando ya están descargados sus paquetes de idioma o el modelo. La activación sigue siendo válida sin red y se vuelve a comprobar más o menos una vez al día. Una API de LLM necesita conexión con tu endpoint."

[[faq.items]]
q = "¿Qué sale de mi Mac?"
a = "Con la Traducción de Apple o un modelo local, nada: la captura, el texto reconocido y la traducción se quedan en este Mac. Con una API de LLM solo el texto reconocido va al endpoint que configures, nunca la captura. La activación envía tu código y un ID de instalación aleatorio, y la búsqueda de actualizaciones contacta con GitHub."

[[faq.items]]
q = "¿Puedo usar otro modelo?"
a = "Sí. En Ajustes → General → Traducción, descarga Index-Translate 2B o Hy-MT2 1.8B (unos 1,1 GB cada uno), que se ejecutan dentro de Transeen, o introduce cualquier endpoint chat/completions compatible con OpenAI, un nombre de modelo y, si lo necesita, una clave que se guarda en tu llavero. Los endpoints remotos deben usar HTTPS; un servidor en localhost puede usar HTTP sin clave."

[[faq.items]]
q = "¿Puede traducir una imagen que ya tengo?"
a = "Sí. Elige Abrir imagen… en el lanzador o pulsa <kbd>⌘O</kbd>; la imagen se abre en la misma ventana, con las mismas herramientas."

[[faq.items]]
q = "¿Qué precisión tiene?"
a = "Depende del servicio de traducción. Las maquetaciones densas, las fórmulas y los términos especializados pueden necesitar correcciones, así que compara con el original con <kbd>Tab</kbd>, o abre el texto completo, antes de fiarte de un detalle."

[[faq.items]]
q = "¿Transeen es de código abierto?"
a = "Sí, con <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">licencia MIT</a>, uso comercial incluido. La app oficial necesita un código TR-; la licencia del código no incluye el servicio de activación alojado, así que las versiones independientes usan el suyo."

[[faq.items]]
q = "¿Cómo se actualiza?"
a = "Elige Buscar actualizaciones… en la barra de menús o el lanzador. Transeen consulta GitHub Releases y abre la descarga cuando hay una versión más reciente."

