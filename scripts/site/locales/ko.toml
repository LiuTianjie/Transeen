[faq]
fig = "자주 묻는 질문"
lede = "<b>자주 묻는 질문.</b> 다른 질문은 GitHub Discussions에 남겨 주세요."

[[faq.items]]
q = "어떤 앱에서 쓸 수 있나요?"
a = "화면에 글자를 보여 주는 앱이라면 모두 됩니다. 브라우저, 채팅과 메일, PDF 뷰어, 게임, 디자인과 동영상 도구, 원격 데스크톱, 가상 머신 등입니다. Transeen은 선택한 영역의 픽셀을 번역하므로 플러그인도, 앱 쪽의 지원도 필요 없습니다. 영역 하나로 여러 앱의 창을 함께 감쌀 수도 있습니다. 앱이 화면 기록을 막아 둔 동영상은 다른 스크린샷과 마찬가지로 검게 나옵니다."

[[faq.items]]
q = "어떤 Mac에서 작동하나요?"
a = "macOS 26 이상, Apple 실리콘과 Intel 모두에서 작동하는 유니버설 앱입니다. 로컬 번역 모델에는 Apple 실리콘이 필요합니다. 인터페이스는 내 언어를 따릅니다: English, 简体中文, 繁體中文, 日本語, 한국어, Français, Español, Deutsch."

[[faq.items]]
q = "오프라인에서도 되나요?"
a = "네, 활성화한 뒤에는 됩니다. 언어 팩이나 모델을 내려받아 두면 캡처, 주석, Apple 번역, 로컬 모델이 오프라인으로 작동합니다. 활성화는 네트워크가 끊겨도 유효하며 하루에 한 번쯤 다시 확인합니다. LLM API는 설정한 엔드포인트에 연결되어야 합니다."

[[faq.items]]
q = "Mac 밖으로 무엇이 나가나요?"
a = "Apple 번역이나 로컬 모델이라면 아무것도 나가지 않습니다. 스크린샷, 인식한 텍스트, 번역 모두 이 Mac에 남습니다. LLM API는 설정한 엔드포인트로 인식한 텍스트만 보내고 스크린샷은 보내지 않습니다. 활성화할 때는 코드와 무작위 설치 ID를 보내고, 업데이트 확인은 GitHub에 접속합니다."

[[faq.items]]
q = "다른 모델을 쓸 수 있나요?"
a = "네. 설정 → 일반 → 번역에서 Index-Translate 2B나 Hy-MT2 1.8B(각각 약 1.1GB)를 내려받으면 Transeen 안에서 실행됩니다. 또는 OpenAI 호환 chat/completions 엔드포인트와 모델 이름, 필요하면 키를 입력합니다. 키는 키체인에 보관됩니다. 원격 엔드포인트는 HTTPS여야 하고, localhost의 서버는 키 없이 HTTP를 써도 됩니다."

[[faq.items]]
q = "이미 가진 이미지도 번역되나요?"
a = "네. 런처에서 ‘이미지 열기…’를 고르거나 <kbd>⌘O</kbd>를 누르면 같은 창에 같은 도구로 열립니다."

[[faq.items]]
q = "얼마나 정확한가요?"
a = "번역 서비스에 따라 다릅니다. 빽빽한 레이아웃, 수식, 전문 용어는 고쳐야 할 때가 있으니, 세부 내용을 믿기 전에 <kbd>Tab</kbd>으로 원문과 비교하거나 전체 텍스트를 열어 확인하세요."

[[faq.items]]
q = "Transeen은 오픈 소스인가요?"
a = "네, <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT 라이선스</a>이며 상업적 이용도 가능합니다. 공식 앱에는 TR- 코드가 필요합니다. 소스 라이선스에는 호스팅 활성화 서비스가 포함되지 않으므로 독립 빌드는 자체 서비스를 갖춰야 합니다."

[[faq.items]]
q = "업데이트는 어떻게 하나요?"
a = "메뉴 막대나 런처에서 ‘업데이트 확인…’을 고르세요. Transeen이 GitHub Releases를 확인하고 새 버전이 있으면 다운로드 페이지를 엽니다."

[closing]
title = "<b class=\"nb\">있는 그 자리에서</b> <span>읽으세요.</span>"
lead = "Transeen을 내려받고 F1을 눌러, 처음 읽지 못했던 곳을 선택해 보세요."
source = "소스 보기"
meta = ["유니버설 앱", "{size}MB", "서명 및 공증 완료"]

