[guide.howto]
name = "Transeen으로 Mac에서 스크린샷을 번역하는 방법"
supply = "TR- 활성화 코드"
tools = ["macOS 26 이상의 Mac", "Transeen"]
steps = [
  { name = "설치", text = "GitHub Releases에서 DMG를 내려받아 Transeen을 응용 프로그램 폴더로 끌어 놓고 엽니다. 메뉴 막대에서 실행됩니다." },
  { name = "활성화", text = "메뉴 막대 메뉴에서 ‘활성화 및 계정…’을 고르고 TR- 코드를 입력한 뒤 ‘이 Mac 활성화’를 고릅니다." },
  { name = "화면 기록 허용", text = "시스템 설정 → 개인정보 보호 및 보안 → 화면 및 시스템 오디오 기록에서 Transeen을 켭니다." },
  { name = "언어 선택", text = "원문과 번역 언어를 고르고, 필요한 Apple 언어 팩을 설정 → 일반 → 번역에서 미리 내려받습니다." },
  { name = "영역 번역", text = "어떤 앱에서든 F1을 누르고 화면의 일부를 선택해 제자리에서 번역을 읽습니다. Tab으로 원문과 비교합니다." },
]

[[guide.sections]]
id = "install"
title = "설치"
body = """
<ol>
  <li><a href="https://github.com/LiuTianjie/Transeen/releases/latest">GitHub Releases</a>에서 최신 DMG를 내려받습니다. 약 {about}MB이며, Apple 실리콘과 Intel을 모두 지원하는 유니버설 앱입니다.</li>
  <li>DMG를 열고 Transeen을 응용 프로그램 폴더로 끌어 놓습니다.</li>
  <li>응용 프로그램 폴더에서 Transeen을 엽니다. 메뉴 막대에서 실행되므로 Dock이 아닌 메뉴 막대에서 아이콘을 찾으세요.</li>
</ol>
<p>앱과 DMG는 Developer ID로 서명하고 Apple의 공증을 받았기 때문에 macOS가 경고 없이 엽니다. 같은 릴리스 페이지에 ZIP과 SHA-256 체크섬도 있습니다. 인터페이스는 Mac의 언어를 따릅니다: English, 简体中文, 繁體中文, 日本語, 한국어, Français, Español, Deutsch.</p>
"""

[[guide.sections]]
id = "activate"
title = "활성화"
body = """
<ol>
  <li>메뉴 막대 메뉴에서 <strong>활성화 및 계정…</strong>을, 또는 홈 창에서 <strong>Transeen 활성화</strong>를 고릅니다.</li>
  <li><code>TR-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX</code> 형식의 코드를 입력하고 <strong>이 Mac 활성화</strong>를 고릅니다. 로그인은 필요 없습니다.</li>
  <li>원하면 Google, GitHub, 이메일로 iTool 계정에 로그인해 라이선스를 연결합니다. 나중에 같은 계정으로 로그인하면 복원됩니다.</li>
</ol>
<p>활성화는 무작위 설치 ID와 영수증만 키체인에 저장하고, Mac의 일련번호는 읽지 않습니다. 코드 하나는 Mac 한 대용이며, 계정을 연결해도 라이선스가 늘어나지 않습니다. StupidMirror의 SM- 코드와 iTool Pro의 IT- 코드는 다른 제품이라 여기서는 쓸 수 없습니다. 코드가 필요하면 <a href="https://github.com/LiuTianjie/Transeen/discussions">GitHub Discussions에 문의하세요</a>.</p>
"""

[[guide.sections]]
id = "permission"
title = "화면 기록 허용"
body = """
<p>처음 캡처할 때 Transeen이 화면 기록 권한을 요청합니다. 오디오는 쓰지 않고 화면 이미지만, 그것도 캡처 단축키를 누를 때만 사용합니다. 기록을 남기지 않고 계속 녹화하지도 않습니다.</p>
<ol>
  <li><strong>시스템 설정 열기…</strong>를 고르거나 시스템 설정 → 개인정보 보호 및 보안 → 화면 및 시스템 오디오 기록으로 갑니다.</li>
  <li>Transeen을 찾아 켭니다.</li>
  <li>Transeen으로 돌아옵니다. 자동으로 다시 확인해 <strong>준비 완료</strong>가 표시되면 <strong>영역 선택</strong>으로 계속합니다.</li>
</ol>
<p>켜 두었는데도 작동하지 않으면 같은 창에서 <strong>다시 확인</strong>이나 <strong>다시 열기</strong>를 누르세요.</p>
"""

[[guide.sections]]
id = "languages"
title = "언어 선택"
body = """
<p>홈 창에는 <strong>원문 언어</strong>와 <strong>번역 언어</strong> 두 메뉴가 있습니다. 원문은 <strong>자동 감지</strong>로 두거나 여덟 가지 언어 중 하나를 고르세요: 중국어 간체, 중국어 번체, 영어, 일본어, 한국어, 프랑스어, 스페인어, 독일어. 어느 언어에서 다른 어느 언어로든 번역합니다.</p>
<p>캡처가 열려 있을 때는 도구 아래의 방향(예: JA → KO)에서 어느 쪽 언어든 바꿀 수 있고, <kbd>F1</kbd>을 한 번 더 누르면 두 언어가 바뀝니다.</p>
<p>Apple 번역은 언어 조합마다 언어 팩이 필요합니다. 처음 실행할 때 열리는 안내와 이후의 설정 → 일반 → 번역에서 번역 언어에 필요한 팩과 상태를 보여 줍니다. <strong>다운로드</strong>로 미리 받아 두면 첫 캡처에서 기다리지 않고, 이후 번역은 Mac에서 오프라인으로 이루어집니다. 언어 팩은 시스템 설정 → 일반 → 언어 및 지역 → 번역 언어에서도 볼 수 있습니다.</p>
"""

[[guide.sections]]
id = "translate"
title = "영역 번역"
body = """
<ol>
  <li>어떤 앱에서든 <kbd>F1</kbd>을 누릅니다. 화면이 멈추고 어두워집니다. 노트북 키보드에서는 <kbd>fn</kbd> <kbd>F1</kbd>입니다(F 키를 표준 기능 키로 쓰도록 설정한 경우는 제외).</li>
  <li>포인터를 올려 문단, 입력란, 창에 맞춘 뒤 클릭하거나, 직접 영역을 끕니다. 영역은 여러 앱의 창에 걸쳐도 됩니다. <kbd>Esc</kbd>나 오른쪽 클릭으로 취소합니다.</li>
  <li>지난번과 같은 자리라면, 선택하는 동안 <kbd>R</kbd>을 눌러 지난 캡처의 영역을 다시 씁니다. 재시동 후에도 됩니다.</li>
  <li>번역은 원래 글자가 있던 자리에 나타나고, 번역되는 대로 한 줄씩 표시됩니다. <kbd>Tab</kbd>으로 원문과 번역을 오가고, <kbd>스페이스</kbd>를 누르고 있으면 원문을 엿볼 수 있습니다.</li>
  <li>조금 모자라면 캡처의 가장자리나 모서리를 끕니다. 같은 정지 화면에서 다시 잘라내고 주석은 그대로 둔 채, 손을 떼면 다시 번역합니다.</li>
  <li>방향이 반대라면 캡처가 열린 상태에서 <kbd>F1</kbd>을 한 번 더 눌러 두 언어를 바꿉니다.</li>
</ol>
<p>Transeen은 화면의 픽셀을 읽으므로 전체 화면 앱과 모든 Space를 포함해 어떤 앱에서든 똑같이 작동하고, 열려 있는 메뉴나 툴팁도 그림에 남습니다. 처음부터 어떤 앱에서든 쓸 수 있는 단축키는 <kbd>F1</kbd>뿐입니다. 번역 없이 주석만 달려면 메뉴 막대 메뉴에서 <strong>주석</strong>을 고르거나 설정 → 단축키에서 키를 지정하세요. 그 창에서 <kbd>T</kbd>를 누르면 나중에 번역할 수도 있습니다. 갖고 있는 이미지를 번역하려면 <strong>이미지 열기…</strong>를 고르거나 <kbd>⌘O</kbd>를 누릅니다.</p>
"""

[[guide.sections]]
id = "mark"
title = "주석 달기"
body = """
<p>도구 막대에서 도구를 고르거나 키를 누릅니다: <kbd>R</kbd> 사각형, <kbd>O</kbd> 타원, <kbd>A</kbd> 화살표, <kbd>P</kbd> 펜, <kbd>V</kbd> 선택 및 이동. 그리기 도구는 기존 주석 위에서 시작해도 언제나 그립니다. 주석을 집으려면 <kbd>V</kbd>를 쓰세요. 번호는 1부터 올라가며 실행 취소와 다시 실행 후에도 그대로입니다.</p>
<p>여섯 가지 색과 세 가지 굵기 중에서 고르거나, 슬라이더로 원하는 색과 1에서 10까지의 굵기를 고를 수 있습니다. <kbd>⌘Z</kbd>와 <kbd>⌘⇧Z</kbd>로 실행 취소와 다시 실행, <kbd>Delete</kbd>로 선택한 주석을 지웁니다. 주석은 별도 레이어에 있어 원문과 번역을 바꿔도 움직이지 않습니다.</p>
"""

[[guide.sections]]
id = "keep"
title = "복사, 저장, 고정"
body = """
<ul>
  <li><kbd>⌘C</kbd>는 주석을 포함해 보이는 그대로 그림을 복사합니다. 번역이 진행 중이어도 됩니다. 기본적으로 복사하면 캡처도 닫힙니다. 열어 두려면 설정에서 <strong>복사 후 캡처 닫기</strong>를 끄세요.</li>
  <li><kbd>⌘S</kbd>는 PNG로 저장합니다.</li>
  <li><strong>화면에 고정</strong>은 그림을 독립된 떠 있는 창으로 화면에 남기고 캡처를 끝내므로, 바로 다음 캡처를 시작할 수 있습니다. 고정한 그림은 전환한 앱 위에 머무릅니다. 어디로든 끌어 놓고 필요한 만큼 둘 수 있으며, 오른쪽 클릭으로 복사, 저장, 원문과 번역 전환, 닫기를 할 수 있습니다.</li>
  <li><strong>텍스트</strong>는 전체 번역을 원문 옆에 열어 바로 복사할 수 있게 합니다.</li>
</ul>
"""

[[guide.sections]]
id = "model"
title = "번역 서비스 고르기"
body = """
<p>설정(<kbd>⌘,</kbd>) → 일반 → 번역에서 <strong>번역 서비스</strong>를 고릅니다. 글자 인식은 항상 Mac에서 합니다.</p>
<h3>Apple 번역(기기 내)</h3>
<p>기본값입니다. 4단계의 언어 팩을 쓰고, 오프라인으로 작동하며, 어디에도 아무것도 보내지 않습니다. 8줄씩 번역하므로 긴 캡처도 읽는 동안 채워집니다.</p>
<h3>로컬 번역 모델</h3>
<p>Index-Translate 2B 또는 Hy-MT2 1.8B(각각 약 1.1GB)를 내려받습니다. 모델은 Transeen 안에서 실행되며 계정도, 추가 앱도, 네트워크도 필요 없습니다. Apple 실리콘 Mac이 필요합니다. 첫 번역은 모델을 불러오느라 몇 초 걸리고, 5분 동안 쓰지 않으면 메모리를 해제합니다. <strong>모델 삭제</strong>로 다시 지울 수 있습니다.</p>
<h3>LLM API</h3>
<p>OpenAI 호환 chat/completions 엔드포인트라면 무엇이든 됩니다. 다음을 입력합니다:</p>
<ul>
  <li><strong>엔드포인트</strong>: 전체 URL. 예: <code>https://api.openai.com/v1/chat/completions</code></li>
  <li><strong>모델 이름</strong></li>
  <li>서비스에 필요하면 API 키를 입력하고 <strong>키 저장</strong>. 키는 키체인에 보관됩니다. <strong>연결 테스트</strong>로 확인할 수 있습니다.</li>
</ul>
<p>내 Mac에서 돌리는 서버도 됩니다. 로컬 주소는 일반 HTTP를 써도 되고 키도 필요 없습니다. 예를 들어 Ollama는 <code>http://localhost:11434/v1/chat/completions</code>입니다. 원격 주소는 HTTPS여야 합니다. 이 방식은 인식한 텍스트만 보내고 스크린샷은 보내지 않습니다. 요청이 실패하면 Transeen이 오류를 보여 주고 원래 그림을 그대로 둡니다.</p>
"""

[[guide.sections]]
id = "shortcuts"
title = "키보드 단축키"
body = """
<div class="table-wrap">
  <table class="keys-table">
    <thead><tr><th scope="col">기본값</th><th scope="col">동작</th></tr></thead>
    <tbody>
      <tr><td><kbd>F1</kbd></td><td>어떤 앱에서든 영역을 선택해 번역</td></tr>
      <tr><td>선택 중 <kbd>R</kbd></td><td>지난 캡처의 영역 다시 쓰기</td></tr>
      <tr><td>열린 캡처에서 <kbd>F1</kbd></td><td>언어 바꾸기, 또는 ‘주석’ 캡처 번역</td></tr>
      <tr><td><kbd>Tab</kbd></td><td>원문과 번역 전환</td></tr>
      <tr><td><kbd>스페이스</kbd> 누르고 있기</td><td>원문 엿보기</td></tr>
      <tr><td><kbd>T</kbd></td><td>번역 또는 다시 시도</td></tr>
      <tr><td><kbd>D</kbd></td><td>언어 바꾸기</td></tr>
      <tr><td><kbd>R</kbd> <kbd>O</kbd> <kbd>A</kbd> <kbd>P</kbd></td><td>사각형, 타원, 화살표, 펜</td></tr>
      <tr><td><kbd>V</kbd></td><td>주석 선택 및 이동</td></tr>
      <tr><td><kbd>⌘C</kbd></td><td>그림 복사</td></tr>
      <tr><td><kbd>⌘S</kbd></td><td>PNG로 저장</td></tr>
      <tr><td><kbd>⌘Z</kbd> <kbd>⌘⇧Z</kbd></td><td>실행 취소, 다시 실행</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>캡처 닫기 또는 선택 취소</td></tr>
      <tr><td><kbd>⌘O</kbd></td><td>이미지 열기</td></tr>
      <tr><td><kbd>⌘,</kbd></td><td>설정 열기</td></tr>
    </tbody>
  </table>
</div>
<p>모두 설정 → 단축키에서 바꿀 수 있고, <strong>모든 단축키를 기본값으로 복원</strong>으로 되돌립니다. <strong>주석</strong>과 <strong>어디서나 원문 보기</strong>는 거기서 지정하기 전까지 키가 없습니다. 전역 단축키에는 <kbd>⌘</kbd>, <kbd>⌥</kbd>, <kbd>⌃</kbd> 중 하나나 F 키가 필요합니다.</p>
"""

[[guide.sections]]
id = "troubleshooting"
title = "문제 해결"
body = """
<h3>F1을 눌러도 아무 일도 없어요</h3>
<p>노트북 키보드에서는 <kbd>fn</kbd>을 누르지 않으면 F1이 밝기를 조절합니다. 또는 시스템 설정 → 키보드 → 키보드 단축키 → 기능 키에서 ‘F1, F2 등의 키를 표준 기능 키로 사용’을 켜세요. 다른 앱이 F1을 쓰고 있을 수도 있으며, 단축키를 등록할 수 없으면 Transeen이 알려 줍니다. 설정 → 단축키에서 다른 키를 고르거나 메뉴 막대 메뉴의 <strong>캡처 후 번역</strong>으로 시작하세요.</p>
<h3>캡처가 비어 있거나 권한을 계속 묻습니다</h3>
<p>메뉴 막대 메뉴에서 <strong>화면 권한…</strong>을 엽니다. 시스템 설정에 Transeen이 이미 켜져 있다면 껐다가 다시 켠 뒤 <strong>다시 열기</strong>를 고르세요.</p>
<h3>창의 일부가 검게 나옵니다</h3>
<p>동영상 같은 콘텐츠를 화면 기록으로부터 보호하는 앱이 있으며, 그 부분은 어떤 스크린샷에서도 검게 찍힙니다. Transeen도 그 부분은 읽거나 번역할 수 없지만, 영역 안의 나머지는 평소처럼 번역합니다.</p>
<h3>Apple 번역이 시작되지 않아요</h3>
<p>그 언어 조합의 언어 팩이 없거나 아직 내려받는 중일 수 있습니다. 설정 → 일반 → 번역에서 내려받거나 시스템 설정 → 일반 → 언어 및 지역 → 번역 언어를 확인한 뒤 다시 시도하세요.</p>
<h3>로컬 모델이 시작되지 않아요</h3>
<p>한 번 다시 시도하세요. 그래도 안 되면 설정 → 일반 → 번역에서 모델을 삭제하고 다시 내려받습니다. 체크섬 검증에 실패한 다운로드는 자동으로 삭제됩니다.</p>
<h3>일부 글자가 잘못 번역돼요</h3>
<p>빽빽한 레이아웃, 수식, 전문 용어는 인식이나 번역을 틀리게 할 수 있습니다. 원문과 비교하거나(<kbd>Tab</kbd>), <strong>텍스트</strong>로 전체 번역을 열거나, 더 작은 영역을 선택해 보세요.</p>
"""

[[guide.sections]]
id = "build"
title = "소스에서 빌드"
body = """
<p>Transeen은 <a href="https://github.com/LiuTianjie/Transeen/blob/main/LICENSE">MIT 라이선스</a>입니다. Xcode 26.4 이상, Swift 6, XcodeGen이 필요합니다.</p>
<pre><code>brew install xcodegen
git clone https://github.com/LiuTianjie/Transeen.git
cd Transeen
./scripts/build.sh</code></pre>
<p>앱은 <code>dist/Transeen.app</code>에 만들어집니다. Developer ID가 없으면 애드혹 서명으로 빌드되며, 서명된 빌드를 원하면 <code>TRANSEEN_SIGNING_IDENTITY</code>를 설정하세요. 테스트는 <code>./scripts/test.sh</code>, <code>./scripts/test-license.sh</code>, <code>./scripts/test-lifecycle.sh</code>입니다. 호스팅 활성화 서비스는 공식 앱의 것이므로, 독립적으로 배포하려면 자체 라이선스 백엔드가 필요합니다.</p>
"""
