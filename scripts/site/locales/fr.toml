[faq]
fig = "Questions"
lede = "<b>Questions.</b>"

[[faq.items]]
q = "Avec quelles apps fonctionne-t-il ?"
a = "Toute app qui affiche du texte à l’écran. Transeen traduit les pixels sélectionnés : aucune extension n’est nécessaire, et un cadre peut couvrir plusieurs apps. Une vidéo protégée de l’enregistrement d’écran apparaît en noir, comme dans toute capture."

[[faq.items]]
q = "Sur quels Mac fonctionne-t-il ?"
a = "macOS 26 ou version ultérieure, sur puce Apple ou Intel. Les modèles locaux nécessitent une puce Apple."

[[faq.items]]
q = "Fonctionne-t-il hors ligne ?"
a = "Oui, une fois activé et le pack de langue ou le modèle téléchargé. Seule une API de LLM a besoin du réseau."

[[faq.items]]
q = "Qu’est-ce qui quitte mon Mac ?"
a = "Avec la Traduction Apple ou un modèle local, rien. Avec une API de LLM, seul le texte reconnu part vers votre point d’accès, jamais la capture."

[[faq.items]]
q = "Puis-je utiliser un autre modèle ?"
a = "Oui : téléchargez Index-Translate 2B ou Hy-MT2 1.8B dans les réglages, ou saisissez une API compatible OpenAI. Les clés restent dans votre trousseau."

[[faq.items]]
q = "Peut-il traduire une image que j’ai déjà ?"
a = "Oui. Appuyez sur <kbd>⌘O</kbd> : elle s’ouvre avec les mêmes outils."

[[faq.items]]
q = "Quelle est sa précision ?"
a = "Cela dépend du service de traduction. Appuyez sur <kbd>Tab</kbd> pour vérifier l’original avant de vous fier à un détail."

[[faq.items]]
q = "Transeen est-il open source ?"
a = "Oui, sous <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">licence MIT</a>. L’app officielle nécessite un code TR-."

[[faq.items]]
q = "Comment mettre à jour ?"
a = "Choisissez Rechercher des mises à jour… dans la barre des menus."

