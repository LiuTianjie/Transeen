<p>Modifiez-les tous dans Réglages → Raccourcis ; <strong>Rétablir tous les raccourcis par défaut</strong> les remet en place. <strong>Annoter</strong> et <strong>Afficher l’original partout</strong> n’ont pas de touche tant que vous n’en définissez pas une. Les raccourcis globaux nécessitent <kbd>⌘</kbd>, <kbd>⌥</kbd> ou <kbd>⌃</kbd>, ou une touche F.</p>
