[[guide.sections]]
id = "install"
title = "Installer"
body = """
<ol>
  <li>Téléchargez le dernier DMG sur <a href="https://github.com/LiuTianjie/Transeen/releases/latest">GitHub Releases</a>. Il pèse environ {about} Mo : une seule app universelle pour puce Apple et Intel.</li>
  <li>Ouvrez le DMG et faites glisser Transeen dans Applications.</li>
  <li>Ouvrez Transeen depuis Applications. Il vit dans la barre des menus : cherchez son icône là plutôt que dans le Dock.</li>
</ol>
<p>L’app et le DMG sont signés avec un Developer ID et notarisés par Apple : macOS les ouvre sans avertissement. Un ZIP et des sommes de contrôle SHA-256 se trouvent sur la même page. L’interface suit la langue de votre Mac : English, 简体中文, 繁體中文, 日本語, 한국어, Français, Español ou Deutsch.</p>
"""

[[guide.sections]]
id = "activate"
title = "Activer"
body = """
<ol>
  <li>Choisissez <strong>Activation et compte…</strong> dans le menu de la barre des menus, ou <strong>Activer Transeen</strong> dans la fenêtre d’accueil.</li>
  <li>Saisissez votre code, de la forme <code>TR-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX</code>, puis choisissez <strong>Activer ce Mac</strong>. Aucune connexion n’est nécessaire.</li>
  <li>Si vous le souhaitez, connectez-vous à un compte iTool avec Google, GitHub ou une adresse e-mail et associez-y la licence. Vous la restaurerez en vous reconnectant au même compte.</li>
</ol>
<p>L’activation garde un identifiant d’installation aléatoire et un reçu dans votre trousseau ; elle ne lit jamais le numéro de série de votre Mac. Un code couvre un Mac, et associer un compte ne crée pas de seconde licence. Les codes SM- de StupidMirror et IT- d’iTool Pro sont d’autres produits et ne fonctionnent pas ici. Pour obtenir un code, <a href="https://github.com/LiuTianjie/Transeen/discussions">demandez dans GitHub Discussions</a>.</p>
"""

[[guide.sections]]
id = "permission"
title = "Autoriser l’enregistrement de l’écran"
body = """
<p>À la première capture, Transeen demande l’autorisation d’enregistrer l’écran. Il n’utilise que l’image de l’écran, jamais l’audio, et seulement quand vous appuyez sur un raccourci de capture. Il ne garde aucun historique et n’enregistre jamais en continu.</p>
<ol>
  <li>Choisissez <strong>Ouvrir Réglages Système…</strong>, ou allez dans Réglages Système → Confidentialité et sécurité → Enregistrement de l’écran et de l’audio du système.</li>
  <li>Trouvez Transeen et activez-le.</li>
  <li>Revenez dans Transeen. Il vérifie de lui-même et affiche <strong>Tout est prêt</strong> ; choisissez <strong>Sélectionner une zone</strong> pour continuer.</li>
</ol>
<p>Si c’est activé mais toujours sans effet, utilisez <strong>Vérifier à nouveau</strong> ou <strong>Rouvrir</strong> dans la même fenêtre.</p>
"""

[[guide.sections]]
id = "languages"
title = "Choisir les langues"
body = """
<p>La fenêtre d’accueil propose deux menus, <strong>Langue source</strong> et <strong>Langue cible</strong>. Laissez la source sur <strong>Détection auto</strong> ou choisissez l’une des huit langues : chinois simplifié, chinois traditionnel, anglais, japonais, coréen, français, espagnol et allemand. Chacune se traduit vers toutes les autres.</p>
<p>Sur une capture ouverte, la direction affichée sous les outils (par exemple JA → FR) permet de changer l’une ou l’autre langue, et une nouvelle pression sur <kbd>F1</kbd> les inverse.</p>
<p>La Traduction Apple a besoin d’un pack de langue pour chaque paire. Le guide qui s’ouvre au premier lancement, puis Réglages → Général → Traduction, listent les packs de votre langue cible avec leur état. <strong>Télécharger</strong> en récupère un avant que votre première capture en ait besoin ; ensuite la traduction se fait sur votre Mac, hors ligne. Les packs figurent aussi dans Réglages Système → Général → Langue et région → Langues de traduction.</p>
"""

[[guide.sections]]
id = "translate"
title = "Traduire une zone"
body = """
<ol>
  <li>Dans n’importe quelle app, appuyez sur <kbd>F1</kbd>. L’écran se fige et s’assombrit. Sur un clavier de portable, c’est <kbd>fn</kbd> <kbd>F1</kbd>, sauf si les touches F servent de touches de fonction standard.</li>
  <li>Survolez pour vous caler sur un paragraphe, un champ ou une fenêtre et cliquez, ou tracez votre propre cadre. Un cadre peut couvrir les fenêtres de plusieurs apps. <kbd>Échap</kbd> ou un clic droit annule.</li>
  <li>Même endroit que la dernière fois ? Appuyez sur <kbd>R</kbd> pendant la sélection : la zone de la dernière capture est reprise, même après un redémarrage.</li>
  <li>Lisez la traduction là où se trouvait le texte. Les lignes apparaissent au fil de la traduction. Appuyez sur <kbd>Tab</kbd> pour passer à l’original et revenir, ou maintenez <kbd>Espace</kbd> pour y jeter un œil.</li>
  <li>Il manque un bout ? Faites glisser un bord ou un coin de la capture. Elle est recadrée à partir du même écran figé, vos annotations restent en place, et elle est retraduite quand vous relâchez.</li>
  <li>Dans le mauvais sens ? Appuyez de nouveau sur <kbd>F1</kbd> pendant que la capture est ouverte : les deux langues s’inversent.</li>
</ol>
<p>Transeen lit les pixels de l’écran : il fonctionne de la même façon dans toutes les apps, y compris en plein écran et sur tous les Spaces, et un menu ou une infobulle ouverts restent dans l’image. <kbd>F1</kbd> est le seul raccourci actif dans toutes les apps dès l’installation. Pour capturer et annoter sans traduire, choisissez <strong>Annoter</strong> dans le menu de la barre des menus, ou attribuez-lui une touche dans Réglages → Raccourcis ; appuyez sur <kbd>T</kbd> dans cette fenêtre si vous voulez finalement la traduction. Pour traduire une image que vous avez déjà, choisissez <strong>Ouvrir une image…</strong> ou appuyez sur <kbd>⌘O</kbd>.</p>
"""

[[guide.sections]]
id = "mark"
title = "Annoter"
body = """
<p>Choisissez un outil dans la barre d’outils ou appuyez sur sa touche : <kbd>R</kbd> pour un rectangle, <kbd>O</kbd> pour une ellipse, <kbd>A</kbd> pour une flèche, <kbd>P</kbd> pour le crayon et <kbd>V</kbd> pour sélectionner et déplacer. Un outil de dessin dessine toujours, même en partant d’une annotation existante ; utilisez <kbd>V</kbd> pour en saisir une. Les numéros comptent à partir de 1 et gardent leur valeur après annuler et rétablir.</p>
<p>Choisissez l’une des six couleurs et des trois épaisseurs, ou ouvrez les curseurs pour une couleur quelconque et une épaisseur de 1 à 10. <kbd>⌘Z</kbd> et <kbd>⌘⇧Z</kbd> annulent et rétablissent ; <kbd>Suppr</kbd> efface l’annotation sélectionnée. Les annotations ont leur propre calque : passer de l’original à la traduction ne les déplace jamais.</p>
"""

[[guide.sections]]
id = "keep"
title = "Copier, enregistrer ou épingler"
body = """
<ul>
  <li><kbd>⌘C</kbd> copie l’image telle que vous la voyez, annotations comprises, même pendant qu’une traduction est en cours. Par défaut, cela ferme aussi la capture ; désactivez <strong>Fermer la capture après la copie</strong> dans les réglages pour la garder ouverte.</li>
  <li><kbd>⌘S</kbd> l’enregistre en PNG.</li>
  <li><strong>Épingler à l’écran</strong> laisse l’image à l’écran dans une fenêtre flottante à part et termine la capture, pour enchaîner aussitôt sur la suivante. Une épingle reste au-dessus de l’app vers laquelle vous basculez. Déplacez-la où vous voulez et gardez-en autant que nécessaire ; un clic droit permet de la copier, l’enregistrer, basculer entre original et traduction ou la fermer.</li>
  <li><strong>Texte</strong> ouvre la traduction complète à côté de l’original, prête à être copiée.</li>
</ul>
"""

[[guide.sections]]
id = "model"
title = "Choisir un service de traduction"
body = """
<p>Ouvrez les réglages (<kbd>⌘,</kbd>) → Général → Traduction et choisissez un <strong>Service de traduction</strong>. La reconnaissance du texte se fait toujours sur votre Mac.</p>
<h3>Traduction Apple (sur l’appareil)</h3>
<p>Le choix par défaut. Elle utilise les packs de langue de l’étape 4, fonctionne hors ligne et n’envoie rien nulle part. Les lignes sont traduites par groupes de huit : une longue capture se remplit pendant que vous lisez.</p>
<h3>Modèle de traduction local</h3>
<p>Téléchargez Index-Translate 2B ou Hy-MT2 1.8B, environ 1,1 Go chacun. Le modèle s’exécute dans Transeen, sans compte, sans autre app et sans réseau. Il faut un Mac avec puce Apple. La première traduction prend quelques secondes pour charger le modèle, et sa mémoire est libérée après cinq minutes d’inactivité. <strong>Supprimer le modèle</strong> le retire.</p>
<h3>API de LLM</h3>
<p>Tout point d’accès chat/completions compatible OpenAI. Renseignez :</p>
<ul>
  <li><strong>Point d’accès</strong>, l’URL complète, par exemple <code>https://api.openai.com/v1/chat/completions</code> ;</li>
  <li><strong>Nom du modèle</strong> ;</li>
  <li>la clé d’API si le service en demande une, puis <strong>Enregistrer la clé</strong>. Elle est gardée dans votre trousseau. <strong>Tester la connexion</strong> la vérifie.</li>
</ul>
<p>Un serveur sur votre propre Mac fonctionne aussi : les adresses locales peuvent utiliser HTTP et se passer de clé, par exemple <code>http://localhost:11434/v1/chat/completions</code> pour Ollama. Les adresses distantes doivent utiliser HTTPS. Ce mode n’envoie que le texte reconnu, jamais la capture. Si une requête échoue, Transeen affiche l’erreur et garde l’image d’origine.</p>
"""

