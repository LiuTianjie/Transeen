[[guide.sections]]
id = "troubleshooting"
title = "Dépannage"
body = """
<h3>Rien ne se passe quand j’appuie sur F1</h3>
<p>Sur un clavier de portable, F1 règle la luminosité sauf si vous maintenez <kbd>fn</kbd>, ou si vous activez « Utiliser les touches F1, F2, etc. comme des touches de fonction standard » dans Réglages Système → Clavier → Raccourcis clavier → Touches de fonction. Une autre app peut aussi occuper F1 ; Transeen vous prévient quand il ne peut pas enregistrer un raccourci. Choisissez une autre touche dans Réglages → Raccourcis, ou partez de <strong>Capturer et traduire</strong> dans le menu de la barre des menus.</p>
<h3>La capture est vide ou l’autorisation est redemandée</h3>
<p>Ouvrez <strong>Autorisation d’écran…</strong> dans le menu de la barre des menus. Si Réglages Système indique déjà Transeen activé, désactivez-le puis réactivez-le, et choisissez <strong>Rouvrir</strong>.</p>
<h3>Une partie de la fenêtre est noire</h3>
<p>Certaines apps protègent la vidéo et d’autres contenus de l’enregistrement d’écran : ils apparaissent en noir dans toute capture. Transeen ne peut ni lire ni traduire cette partie ; le reste du cadre fonctionne normalement.</p>
<h3>La Traduction Apple ne démarre pas</h3>
<p>Le pack de langue de cette paire manque peut-être ou est encore en cours de téléchargement. Téléchargez-le dans Réglages → Général → Traduction, ou vérifiez Réglages Système → Général → Langue et région → Langues de traduction, puis réessayez.</p>
<h3>Le modèle local ne démarre pas</h3>
<p>Réessayez une fois. Si cela échoue encore, supprimez le modèle dans Réglages → Général → Traduction et retéléchargez-le ; un téléchargement dont la somme de contrôle échoue est supprimé automatiquement.</p>
<h3>Une partie du texte est mal traduite</h3>
<p>Les mises en page denses, les formules et les termes spécialisés peuvent tromper la reconnaissance ou la traduction. Comparez avec l’original (<kbd>Tab</kbd>), ouvrez <strong>Texte</strong> pour la traduction complète, ou sélectionnez une zone plus petite.</p>
"""

[[guide.sections]]
id = "build"
title = "Compiler depuis les sources"
body = """
<p>Transeen est sous <a href="https://github.com/LiuTianjie/Transeen/blob/main/LICENSE">licence MIT</a>. Il vous faut Xcode 26.4 ou version ultérieure, Swift 6 et XcodeGen.</p>
<pre><code>brew install xcodegen
git clone https://github.com/LiuTianjie/Transeen.git
cd Transeen
./scripts/build.sh</code></pre>
<p>L’app est écrite dans <code>dist/Transeen.app</code>. Sans identité Developer ID, la compilation est signée ad hoc ; définissez <code>TRANSEEN_SIGNING_IDENTITY</code> pour une compilation signée. Les tests sont <code>./scripts/test.sh</code>, <code>./scripts/test-license.sh</code> et <code>./scripts/test-lifecycle.sh</code>. Le service d’activation hébergé appartient à l’app officielle : une distribution indépendante a besoin de son propre serveur de licences.</p>
"""
