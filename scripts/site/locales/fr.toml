      <tr><td>Maintenir <kbd>Espace</kbd></td><td>Jeter un œil à l’original</td></tr>
      <tr><td><kbd>T</kbd></td><td>Traduire, ou réessayer</td></tr>
      <tr><td><kbd>D</kbd></td><td>Inverser les langues</td></tr>
