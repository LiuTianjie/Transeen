[faq]
fig = "Fragen"
lede = "<b>Fragen.</b>"

[[faq.items]]
q = "Mit welchen Apps funktioniert es?"
a = "Mit jeder App, die Text auf dem Bildschirm zeigt. Transeen übersetzt die ausgewählten Pixel, braucht also kein Plug-in, und ein Rahmen kann mehrere Apps umfassen. Video, das vor Bildschirmaufnahmen geschützt ist, erscheint schwarz, wie in jedem Screenshot."

[[faq.items]]
q = "Auf welchen Macs läuft es?"
a = "macOS 26 oder neuer, auf Apple-Chip oder Intel. Die lokalen Modelle brauchen einen Apple-Chip."

[[faq.items]]
q = "Funktioniert es offline?"
a = "Ja, sobald es aktiviert ist und das Sprachpaket oder Modell geladen ist. Nur eine LLM-API braucht eine Verbindung."

[[faq.items]]
q = "Was verlässt meinen Mac?"
a = "Mit der Apple-Übersetzung oder einem lokalen Modell nichts. Mit einer LLM-API geht nur der erkannte Text an deinen Endpunkt, nie der Screenshot."

[[faq.items]]
q = "Kann ich ein anderes Modell nutzen?"
a = "Ja: Lade Index-Translate 2B oder Hy-MT2 1.8B in den Einstellungen oder gib eine OpenAI-kompatible API ein. Schlüssel bleiben im Schlüsselbund."

[[faq.items]]
q = "Kann es ein vorhandenes Bild übersetzen?"
a = "Ja. Drück <kbd>⌘O</kbd>, und es öffnet sich mit denselben Werkzeugen."

[[faq.items]]
q = "Wie genau ist es?"
a = "Das hängt vom Übersetzungsdienst ab. Prüf mit <kbd>Tab</kbd> das Original, bevor du dich auf ein Detail verlässt."

[[faq.items]]
q = "Ist Transeen Open Source?"
a = "Ja, unter der <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT-Lizenz</a>. Die offizielle App braucht einen TR-Code."

[[faq.items]]
q = "Wie aktualisiere ich?"
a = "Wähl in der Menüleiste „Nach Updates suchen…“."

