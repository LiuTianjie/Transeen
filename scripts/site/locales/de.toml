[[how.cells]]
label = "Abheben"
title = "Nur die Schrift geht ab"
text = "Die Buchstaben werden herausgelöst und der Hintergrund darunter wiederhergestellt, Verlauf oder Struktur inklusive."

[[how.cells]]
label = "Setzen"
title = "Deine kommen, wo sie waren"
text = "Gleiche Position, Größe und Farbe. Eine Zeile wird nur schmaler gesetzt oder umbrochen, wenn die Übersetzung nicht passt."

[apps]
fig = "Jede App"
lede = "<b>In jeder App, auch über Apps hinweg.</b> Transeen liest die Pixel auf deinem Bildschirm und funktioniert deshalb überall, wo Text erscheint, ohne dass du in der App etwas installierst."
caption = "Ein Rahmen über die Fenster zweier Apps, als ein Bild übersetzt"

[[apps.items]]
title = "Keine Plug-ins, keine Integrationen"
text = "Browser, Chats, PDFs, Spiele, Design-Tools, Remote-Desktops: Was auf dem Bildschirm steht, lässt sich übersetzen. Auch Text, den du nicht markieren kannst."

[[apps.items]]
title = "Ein Rahmen über mehrere Apps"
text = "Ein Rahmen kann Fenster verschiedener Apps zugleich umfassen. Jede Zeile darin wird in derselben Aufnahme übersetzt."

[[apps.items]]
title = "Im Vollbild und auf jedem Space"
text = "F1 funktioniert in einer App im Vollbild und auf jedem Schreibtisch. Ein offenes Menü, Popover oder Tooltip bleibt im Bild, und die App behält den Fokus."

[[apps.items]]
title = "Rastet an dem ein, was da ist"
text = "Halt den Zeiger an, und der Rahmen findet den Absatz, das Feld oder das Fenster darunter, egal zu welcher App es gehört."

[[apps.items]]
title = "Angeheftetes schwebt über allen Apps"
text = "Eine angeheftete Übersetzung bleibt über der App, zu der du wechselst. So liest du sie direkt neben der App, in der du arbeitest."

