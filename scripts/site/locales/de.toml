[faq]
fig = "Fragen"
lede = "<b>Fragen.</b> Alles Weitere fragst du am besten in GitHub Discussions."

[[faq.items]]
q = "Mit welchen Apps funktioniert es?"
a = "Mit jeder App, die Text auf dem Bildschirm zeigt: Browser, Chat und Mail, PDF-Reader, Spiele, Design- und Video-Tools, Remote-Desktops und virtuelle Maschinen. Transeen übersetzt die Pixel, die du auswählst; es braucht also weder ein Plug-in noch Unterstützung durch die App, und ein Rahmen kann Fenster mehrerer Apps umfassen. Video, das eine App vor Bildschirmaufnahmen schützt, erscheint schwarz, wie in jedem Screenshot."

[[faq.items]]
q = "Auf welchen Macs läuft Transeen?"
a = "macOS 26 oder neuer, auf Apple-Chip oder Intel: Es ist eine einzige universelle App. Die lokalen Übersetzungsmodelle brauchen einen Apple-Chip. Die Oberfläche folgt deiner Sprache: English, 简体中文, 繁體中文, 日本語, 한국어, Français, Español oder Deutsch."

[[faq.items]]
q = "Funktioniert es offline?"
a = "Ja, sobald es aktiviert ist. Aufnahme, Markierung, Apple-Übersetzung und die lokalen Modelle laufen offline, wenn ihre Sprachpakete oder das Modell geladen sind. Eine Aktivierung bleibt auch ohne Netz gültig und wird etwa einmal am Tag erneut geprüft. Eine LLM-API braucht eine Verbindung zu deinem Endpunkt."

[[faq.items]]
q = "Was verlässt meinen Mac?"
a = "Mit der Apple-Übersetzung oder einem lokalen Modell nichts: Screenshot, erkannter Text und Übersetzung bleiben auf diesem Mac. Mit einer LLM-API geht nur der erkannte Text an den Endpunkt, den du festlegst, nie der Screenshot. Die Aktivierung sendet deinen Code und eine zufällige Installations-ID, und die Suche nach Updates fragt bei GitHub an."

[[faq.items]]
q = "Kann ich ein anderes Modell nutzen?"
a = "Ja. Lade unter Einstellungen → Allgemein → Übersetzung Index-Translate 2B oder Hy-MT2 1.8B (je etwa 1,1 GB), die in Transeen laufen, oder gib einen OpenAI-kompatiblen chat/completions-Endpunkt, einen Modellnamen und bei Bedarf einen Schlüssel ein, der in deinem Schlüsselbund liegt. Entfernte Endpunkte müssen HTTPS nutzen; ein Server auf localhost darf HTTP ohne Schlüssel verwenden."

[[faq.items]]
q = "Kann es ein Bild übersetzen, das ich schon habe?"
a = "Ja. Wähl im Starter „Bild öffnen…“ oder drück <kbd>⌘O</kbd>; das Bild öffnet sich im selben Fenster mit denselben Werkzeugen."

[[faq.items]]
q = "Wie genau ist es?"
a = "Das hängt vom Übersetzungsdienst ab. Dichte Layouts, Formeln und Fachbegriffe müssen manchmal korrigiert werden. Vergleich deshalb mit <kbd>Tab</kbd> das Original oder öffne den ganzen Text, bevor du dich auf ein Detail verlässt."

[[faq.items]]
q = "Ist Transeen Open Source?"
a = "Ja, unter der <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT-Lizenz</a>, auch für kommerzielle Nutzung. Die offizielle App braucht einen TR-Code; die Lizenz des Quellcodes umfasst nicht den gehosteten Aktivierungsdienst, unabhängige Builds bringen deshalb ihren eigenen mit."

[[faq.items]]
q = "Wie aktualisiere ich?"
a = "Wähl in der Menüleiste oder im Starter „Nach Updates suchen…“. Transeen prüft GitHub Releases und öffnet den Download, wenn es eine neuere Version gibt."

