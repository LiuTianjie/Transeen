[[tools.items]]
title = "Als Text lesen"
text = "Öffne die ganze Übersetzung neben dem Original als Liste zum Markieren und Kopieren."

[[tools.items]]
title = "Ein Bild öffnen"
text = "Auch ein Screenshot, den dir jemand geschickt hat, funktioniert. Drück <kbd>⌘O</kbd>, und er öffnet sich mit denselben Werkzeugen."

