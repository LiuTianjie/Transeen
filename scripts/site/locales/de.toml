[[guide.sections]]
id = "install"
title = "Installieren"
body = """
<ol>
  <li>Lade das neueste DMG von <a href="https://github.com/LiuTianjie/Transeen/releases/latest">GitHub Releases</a>. Es ist etwa {about} MB groß, eine universelle App für Apple-Chip und Intel.</li>
  <li>Öffne das DMG und zieh Transeen in den Ordner „Programme“.</li>
  <li>Öffne Transeen aus „Programme“. Es lebt in der Menüleiste; such sein Symbol also dort und nicht im Dock.</li>
</ol>
<p>App und DMG sind mit einer Developer ID signiert und von Apple beglaubigt, macOS öffnet sie deshalb ohne Warnung. Ein ZIP und SHA-256-Prüfsummen liegen auf derselben Seite. Die Oberfläche folgt der Sprache deines Macs: English, 简体中文, 繁體中文, 日本語, 한국어, Français, Español oder Deutsch.</p>
"""

[[guide.sections]]
id = "activate"
title = "Aktivieren"
body = """
<ol>
  <li>Wähl im Menü der Menüleiste <strong>Aktivierung &amp; Konto…</strong> oder im Startfenster <strong>Transeen aktivieren</strong>.</li>
  <li>Gib deinen Code ein, der wie <code>TR-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX</code> aussieht, und wähl <strong>Diesen Mac aktivieren</strong>. Eine Anmeldung ist nicht nötig.</li>
  <li>Wenn du möchtest, meld dich mit Google, GitHub oder E-Mail bei einem iTool-Konto an und verknüpfe die Lizenz. Mit einer späteren Anmeldung beim selben Konto stellst du sie wieder her.</li>
</ol>
<p>Die Aktivierung legt nur eine zufällige Installations-ID und einen Beleg im Schlüsselbund ab; die Seriennummer deines Macs wird nie gelesen. Ein Code gilt für einen Mac, und das Verknüpfen eines Kontos erzeugt keine zweite Lizenz. SM-Codes von StupidMirror und IT-Codes von iTool Pro gehören zu anderen Produkten und funktionieren hier nicht. Einen Code bekommst du, wenn du <a href="https://github.com/LiuTianjie/Transeen/discussions">in GitHub Discussions fragst</a>.</p>
"""

[[guide.sections]]
id = "permission"
title = "Bildschirmaufnahme erlauben"
body = """
<p>Bei der ersten Aufnahme fragt Transeen nach der Berechtigung zur Bildschirmaufnahme. Es nutzt nur das Bildschirmbild, nie Ton, und nur, wenn du einen Aufnahme-Kurzbefehl drückst. Es speichert keinen Verlauf und nimmt nie dauerhaft auf.</p>
<ol>
  <li>Wähl <strong>Systemeinstellungen öffnen…</strong> oder geh zu Systemeinstellungen → Datenschutz &amp; Sicherheit → Bildschirm- &amp; Systemaudioaufnahme.</li>
  <li>Such Transeen und schalte es ein.</li>
  <li>Kehr zu Transeen zurück. Es prüft von selbst erneut und zeigt <strong>Alles bereit</strong>; mit <strong>Bereich auswählen</strong> geht es weiter.</li>
</ol>
<p>Ist es eingeschaltet, wirkt aber noch nicht, nutze im selben Fenster <strong>Erneut prüfen</strong> oder <strong>Neu öffnen</strong>.</p>
"""

[[guide.sections]]
id = "languages"
title = "Sprachen wählen"
body = """
<p>Das Startfenster hat zwei Menüs, <strong>Ausgangssprache</strong> und <strong>Zielsprache</strong>. Lass die Ausgangssprache auf <strong>Automatisch</strong> oder wähl eine der acht Sprachen: vereinfachtes Chinesisch, traditionelles Chinesisch, Englisch, Japanisch, Koreanisch, Französisch, Spanisch und Deutsch. Jede lässt sich in jede andere übersetzen.</p>
<p>Bei einer offenen Aufnahme ändert die Richtung unter den Werkzeugen (zum Beispiel JA → DE) eine der beiden Sprachen, und ein erneutes <kbd>F1</kbd> tauscht sie.</p>
<p>Die Apple-Übersetzung braucht für jedes Sprachpaar ein Sprachpaket. Die Einführung beim ersten Start und später Einstellungen → Allgemein → Übersetzung zeigen die Pakete für deine Zielsprache mit ihrem Status. <strong>Laden</strong> holt eines, bevor deine erste Aufnahme es braucht; danach läuft die Übersetzung offline auf deinem Mac. Die Pakete stehen auch unter Systemeinstellungen → Allgemein → Sprache &amp; Region → Übersetzungssprachen.</p>
"""

[[guide.sections]]
id = "translate"
title = "Einen Bereich übersetzen"
body = """
<ol>
  <li>Drück in jeder App <kbd>F1</kbd>. Der Bildschirm hält still und wird abgedunkelt. Auf einer Laptop-Tastatur ist das <kbd>fn</kbd> <kbd>F1</kbd>, außer die F-Tasten arbeiten als Standard-Funktionstasten.</li>
  <li>Fahr über einen Absatz, ein Feld oder ein Fenster, damit der Rahmen einrastet, und klick, oder zieh einen eigenen Rahmen. Ein Rahmen kann Fenster mehrerer Apps umfassen. <kbd>Esc</kbd> oder ein Rechtsklick bricht ab.</li>
  <li>Dieselbe Stelle wie beim letzten Mal? Drück beim Auswählen <kbd>R</kbd>, und der Bereich der letzten Aufnahme wird erneut genommen, auch nach einem Neustart.</li>
  <li>Lies die Übersetzung dort, wo der Text stand. Die Zeilen erscheinen, sobald sie übersetzt sind. Mit <kbd>Tab</kbd> wechselst du zum Original und zurück, mit gedrückter <kbd>Leertaste</kbd> siehst du kurz nach.</li>
  <li>Etwas vergessen? Zieh einen Rand oder eine Ecke der Aufnahme. Sie wird aus demselben eingefrorenen Bildschirm neu zugeschnitten, deine Markierungen bleiben an ihrem Platz, und beim Loslassen wird erneut übersetzt.</li>
  <li>Falsche Richtung? Drück erneut <kbd>F1</kbd>, während die Aufnahme offen ist, und die beiden Sprachen tauschen.</li>
</ol>
<p>Transeen liest die Pixel auf dem Bildschirm und funktioniert deshalb in jeder App gleich, im Vollbild und auf jedem Space, und ein offenes Menü oder ein Tooltip bleibt im Bild. <kbd>F1</kbd> ist der einzige Kurzbefehl, der ab Werk in jeder App funktioniert. Willst du ohne Übersetzung aufnehmen und markieren, wähl im Menü der Menüleiste <strong>Markieren</strong> oder gib ihm unter Einstellungen → Kurzbefehle eine Taste; drück in diesem Fenster <kbd>T</kbd>, wenn du doch übersetzen möchtest. Um ein vorhandenes Bild zu übersetzen, wähl <strong>Bild öffnen…</strong> oder drück <kbd>⌘O</kbd>.</p>
"""

[[guide.sections]]
id = "mark"
title = "Markieren"
body = """
<p>Wähl ein Werkzeug in der Symbolleiste oder drück seine Taste: <kbd>R</kbd> für ein Rechteck, <kbd>O</kbd> für eine Ellipse, <kbd>A</kbd> für einen Pfeil, <kbd>P</kbd> für den Stift und <kbd>V</kbd> zum Auswählen und Bewegen. Ein Zeichenwerkzeug zeichnet immer, auch wenn du auf einer vorhandenen Markierung beginnst; mit <kbd>V</kbd> greifst du eine Markierung. Nummern zählen ab 1 und behalten ihren Wert beim Widerrufen und Wiederholen.</p>
<p>Wähl eine von sechs Farben und drei Stärken oder öffne die Regler für jede Farbe und eine Stärke von 1 bis 10. <kbd>⌘Z</kbd> und <kbd>⌘⇧Z</kbd> widerrufen und wiederholen; <kbd>Entf</kbd> löscht die ausgewählte Markierung. Markierungen liegen auf einer eigenen Ebene, beim Wechsel zwischen Original und Übersetzung verrutschen sie nie.</p>
"""

[[guide.sections]]
id = "keep"
title = "Kopieren, sichern oder anheften"
body = """
<ul>
  <li><kbd>⌘C</kbd> kopiert das Bild so, wie du es siehst, mit Markierungen, auch während noch übersetzt wird. Standardmäßig schließt das die Aufnahme; schalte in den Einstellungen <strong>Aufnahme nach dem Kopieren schließen</strong> aus, um sie offen zu lassen.</li>
  <li><kbd>⌘S</kbd> sichert es als PNG.</li>
  <li><strong>Am Bildschirm anheften</strong> lässt das Bild als eigenes schwebendes Fenster auf dem Bildschirm und beendet die Aufnahme, damit die nächste sofort beginnen kann. Ein angeheftetes Bild bleibt über der App, zu der du wechselst. Zieh es, wohin du willst, und behalte so viele, wie du brauchst; per Rechtsklick kopierst, sicherst, schaltest du zwischen Original und Übersetzung um oder schließt es.</li>
  <li><strong>Text</strong> öffnet die ganze Übersetzung neben dem Original, bereit zum Kopieren.</li>
</ul>
"""

[[guide.sections]]
id = "model"
title = "Einen Übersetzungsdienst wählen"
body = """
<p>Öffne die Einstellungen (<kbd>⌘,</kbd>) → Allgemein → Übersetzung und wähl einen <strong>Übersetzungsdienst</strong>. Die Texterkennung passiert immer auf deinem Mac.</p>
<h3>Apple-Übersetzung (auf dem Gerät)</h3>
<p>Der Standard. Sie nutzt die Sprachpakete aus Schritt 4, läuft offline und sendet nichts. Die Zeilen werden in Gruppen zu acht übersetzt, eine lange Aufnahme füllt sich also, während du liest.</p>
<h3>Lokales Übersetzungsmodell</h3>
<p>Lade Index-Translate 2B oder Hy-MT2 1.8B, je etwa 1,1 GB. Das Modell läuft in Transeen, ohne Konto, ohne zusätzliche App und ohne Netz. Es braucht einen Mac mit Apple-Chip. Die erste Übersetzung lädt das Modell in wenigen Sekunden, und nach fünf Minuten Leerlauf wird sein Speicher freigegeben. <strong>Modell löschen</strong> entfernt es wieder.</p>
<h3>LLM-API</h3>
<p>Jeder OpenAI-kompatible chat/completions-Endpunkt. Trag ein:</p>
<ul>
  <li><strong>Endpunkt</strong>, die vollständige URL, zum Beispiel <code>https://api.openai.com/v1/chat/completions</code>;</li>
  <li><strong>Modellname</strong>;</li>
  <li>den API-Schlüssel, falls der Dienst einen braucht, dann <strong>Schlüssel sichern</strong>. Er liegt in deinem Schlüsselbund. <strong>Verbindung testen</strong> prüft ihn.</li>
</ul>
<p>Ein Server auf deinem eigenen Mac geht auch: Lokale Adressen dürfen einfaches HTTP nutzen und brauchen keinen Schlüssel, zum Beispiel <code>http://localhost:11434/v1/chat/completions</code> für Ollama. Entfernte Adressen müssen HTTPS nutzen. Dieser Modus sendet nur den erkannten Text, nie den Screenshot. Schlägt eine Anfrage fehl, zeigt Transeen den Fehler und behält das Originalbild.</p>
"""

[[guide.sections]]
id = "shortcuts"
title = "Tastaturkurzbefehle"
body = """
<div class="table-wrap">
  <table class="keys-table">
    <thead><tr><th scope="col">Standard</th><th scope="col">Aktion</th></tr></thead>
    <tbody>
      <tr><td><kbd>F1</kbd></td><td>Einen Bereich auswählen und übersetzen, aus jeder App</td></tr>
      <tr><td><kbd>R</kbd> beim Auswählen</td><td>Den Bereich der letzten Aufnahme erneut nehmen</td></tr>
      <tr><td><kbd>F1</kbd> bei offener Aufnahme</td><td>Sprachen tauschen oder eine „Markieren“-Aufnahme übersetzen</td></tr>
      <tr><td><kbd>Tab</kbd></td><td>Zwischen Original und Übersetzung umschalten</td></tr>
      <tr><td><kbd>Leertaste</kbd> halten</td><td>Kurz das Original ansehen</td></tr>
      <tr><td><kbd>T</kbd></td><td>Übersetzen oder erneut versuchen</td></tr>
      <tr><td><kbd>D</kbd></td><td>Sprachen tauschen</td></tr>
      <tr><td><kbd>R</kbd> <kbd>O</kbd> <kbd>A</kbd> <kbd>P</kbd></td><td>Rechteck, Ellipse, Pfeil, Stift</td></tr>
      <tr><td><kbd>V</kbd></td><td>Markierungen auswählen und bewegen</td></tr>
      <tr><td><kbd>⌘C</kbd></td><td>Bild kopieren</td></tr>
      <tr><td><kbd>⌘S</kbd></td><td>Als PNG sichern</td></tr>
      <tr><td><kbd>⌘Z</kbd> <kbd>⌘⇧Z</kbd></td><td>Widerrufen, wiederholen</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>Aufnahme schließen oder Auswahl abbrechen</td></tr>
      <tr><td><kbd>⌘O</kbd></td><td>Ein Bild öffnen</td></tr>
      <tr><td><kbd>⌘,</kbd></td><td>Einstellungen öffnen</td></tr>
    </tbody>
  </table>
</div>
<p>Ändere jeden davon unter Einstellungen → Kurzbefehle; <strong>Alle Standardkurzbefehle wiederherstellen</strong> setzt sie zurück. <strong>Markieren</strong> und <strong>Original überall zeigen</strong> haben keine Taste, bis du dort eine festlegst. Globale Kurzbefehle brauchen <kbd>⌘</kbd>, <kbd>⌥</kbd> oder <kbd>⌃</kbd> oder eine F-Taste.</p>
"""

[[guide.sections]]
id = "troubleshooting"
title = "Fehlerbehebung"
body = """
<h3>Beim Drücken von F1 passiert nichts</h3>
<p>Auf einer Laptop-Tastatur ändert F1 die Helligkeit, außer du hältst <kbd>fn</kbd> oder schaltest unter Systemeinstellungen → Tastatur → Tastaturkurzbefehle → Funktionstasten „F1, F2 usw. als Standard-Funktionstasten verwenden“ ein. Auch eine andere App kann F1 belegen; Transeen meldet es, wenn es einen Kurzbefehl nicht registrieren kann. Wähl unter Einstellungen → Kurzbefehle eine andere Taste oder starte über <strong>Aufnehmen &amp; übersetzen</strong> im Menü der Menüleiste.</p>
<h3>Die Aufnahme ist leer, oder die Berechtigung wird immer wieder abgefragt</h3>
<p>Öffne <strong>Bildschirmberechtigung…</strong> im Menü der Menüleiste. Zeigen die Systemeinstellungen Transeen bereits als eingeschaltet, schalte es aus und wieder ein und wähl dann <strong>Neu öffnen</strong>.</p>
<h3>Ein Teil des Fensters ist schwarz</h3>
<p>Manche Apps schützen Video und andere Inhalte vor Bildschirmaufnahmen; diese erscheinen in jedem Screenshot schwarz. Transeen kann diesen Teil weder lesen noch übersetzen, der Rest des Rahmens funktioniert wie gewohnt.</p>
<h3>Die Apple-Übersetzung startet nicht</h3>
<p>Das Sprachpaket für dieses Paar fehlt vielleicht oder wird noch geladen. Lade es unter Einstellungen → Allgemein → Übersetzung oder sieh unter Systemeinstellungen → Allgemein → Sprache &amp; Region → Übersetzungssprachen nach und versuch es erneut.</p>
<h3>Das lokale Modell startet nicht</h3>
<p>Versuch es noch einmal. Klappt es weiterhin nicht, lösch das Modell unter Einstellungen → Allgemein → Übersetzung und lade es neu; ein Download, dessen Prüfsumme nicht stimmt, wird automatisch gelöscht.</p>
<h3>Ein Teil des Texts wird falsch übersetzt</h3>
<p>Dichte Layouts, Formeln und Fachbegriffe können die Erkennung oder die Übersetzung ins Stolpern bringen. Vergleich mit dem Original (<kbd>Tab</kbd>), öffne <strong>Text</strong> für die ganze Übersetzung oder wähl einen kleineren Bereich.</p>
"""

[[guide.sections]]
id = "build"
title = "Aus dem Quellcode bauen"
body = """
<p>Transeen steht unter der <a href="https://github.com/LiuTianjie/Transeen/blob/main/LICENSE">MIT-Lizenz</a>. Du brauchst Xcode 26.4 oder neuer, Swift 6 und XcodeGen.</p>
<pre><code>brew install xcodegen
git clone https://github.com/LiuTianjie/Transeen.git
cd Transeen
./scripts/build.sh</code></pre>
<p>Die App landet in <code>dist/Transeen.app</code>. Ohne Developer-ID-Identität wird ad hoc signiert; setz <code>TRANSEEN_SIGNING_IDENTITY</code> für einen signierten Build. Die Tests sind <code>./scripts/test.sh</code>, <code>./scripts/test-license.sh</code> und <code>./scripts/test-lifecycle.sh</code>. Der gehostete Aktivierungsdienst gehört zur offiziellen App, eine unabhängige Verteilung braucht deshalb ein eigenes Lizenz-Backend.</p>
"""
