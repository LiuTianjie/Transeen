[[guide.sections]]
id = "install"
title = "インストール"
body = """
<ol>
  <li><a href="https://github.com/LiuTianjie/Transeen/releases/latest">GitHub Releases</a> から最新の DMG をダウンロードします。約 {about} MB で、Apple シリコンと Intel の両方に対応したユニバーサル App です。</li>
  <li>DMG を開き、Transeen をアプリケーションフォルダにドラッグします。</li>
  <li>アプリケーションフォルダから Transeen を開きます。メニューバーで動作するので、Dock ではなくメニューバーのアイコンを探してください。</li>
</ol>
<p>App と DMG は Developer ID で署名され、Apple の公証を受けているので、macOS は警告なしで開きます。同じリリースページに ZIP と SHA-256 チェックサムもあります。画面表示は Mac の言語に合わせます：English、简体中文、繁體中文、日本語、한국어、Français、Español、Deutsch。</p>
"""

[[guide.sections]]
id = "activate"
title = "アクティベート"
body = """
<ol>
  <li>メニューバーのメニューで <strong>アクティベーションとアカウント…</strong> を、またはホームウインドウで <strong>Transeen をアクティベート</strong> を選びます。</li>
  <li><code>TR-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX</code> の形式のコードを入力し、<strong>この Mac をアクティベート</strong> を選びます。ログインは不要です。</li>
  <li>必要なら Google、GitHub、メールで iTool アカウントにログインし、ライセンスを連携します。あとで同じアカウントにログインすれば復元できます。</li>
</ol>
<p>アクティベーションでは、ランダムなインストール ID とレシートをキーチェーンに保存するだけで、Mac のシリアル番号は読み取りません。1 つのコードで Mac 1 台分です。アカウントに連携してもライセンスは増えません。StupidMirror の SM- コードと iTool Pro の IT- コードは別製品のもので、ここでは使えません。コードの入手は <a href="https://github.com/LiuTianjie/Transeen/discussions">GitHub Discussions で問い合わせてください</a>。</p>
"""

[[guide.sections]]
id = "permission"
title = "画面収録を許可"
body = """
<p>初めてキャプチャするとき、Transeen は画面収録の許可を求めます。使うのは画面の画像だけで、音声は使いません。キャプチャのショートカットを押したときにしか画面を取得せず、履歴も残さず、録画し続けることもありません。</p>
<ol>
  <li><strong>システム設定を開く…</strong> を選ぶか、システム設定 → プライバシーとセキュリティ → 画面収録とシステムオーディオ録音 を開きます。</li>
  <li>Transeen を見つけてオンにします。</li>
  <li>Transeen に戻ります。自動で確認し直して <strong>準備完了</strong> と表示されたら、<strong>範囲を選択</strong> で続けます。</li>
</ol>
<p>オンにしても反映されない場合は、同じウインドウで <strong>再確認</strong> か <strong>開き直す</strong> を使ってください。</p>
"""

[[guide.sections]]
id = "languages"
title = "言語を選ぶ"
body = """
<p>ホームウインドウには <strong>原文の言語</strong> と <strong>翻訳先の言語</strong> の 2 つのメニューがあります。原文は <strong>自動検出</strong> のままにするか、8 つの言語から選びます：簡体字中国語、繁体字中国語、英語、日本語、韓国語、フランス語、スペイン語、ドイツ語。どの言語からでも他のどの言語にも翻訳できます。</p>
<p>キャプチャを開いているときは、ツールの下にある方向（例：EN → JA）でどちらの言語も変えられます。もう一度 <kbd>F1</kbd> を押すと入れ替わります。</p>
<p>Apple 翻訳には、言語の組み合わせごとに言語パックが必要です。初回起動時のガイドと、その後は 設定 → 一般 → 翻訳 に、翻訳先の言語に必要なパックと状態が表示されます。<strong>ダウンロード</strong> で先に入れておけば、最初のキャプチャで待ちません。以後の翻訳は Mac 上でオフラインで行われます。言語パックは システム設定 → 一般 → 言語と地域 → 翻訳言語 でも確認できます。</p>
"""

[[guide.sections]]
id = "translate"
title = "範囲を翻訳"
body = """
<ol>
  <li>どのアプリでも <kbd>F1</kbd> を押します。画面が静止して暗くなります。ノートパソコンのキーボードでは <kbd>fn</kbd> <kbd>F1</kbd> です（F キーを標準のファンクションキーとして使う設定にしている場合を除く）。</li>
  <li>ポインタを合わせて段落や入力欄、ウインドウに吸着させてクリックするか、自分で範囲をドラッグします。範囲は複数のアプリのウインドウにまたがっても構いません。<kbd>Esc</kbd> か右クリックでキャンセルします。</li>
  <li>前回と同じ場所なら、範囲を選ぶときに <kbd>R</kbd> を押すと前回のキャプチャの範囲をもう一度使います。再起動後も有効です。</li>
  <li>訳文は元の文字があった場所に表示され、翻訳できた行から順に出てきます。<kbd>Tab</kbd> で原文と訳文を切り替え、<kbd>スペース</kbd> を押し続けると原文をのぞけます。</li>
  <li>少し足りなければ、キャプチャの端か角をドラッグします。同じ静止画面から切り抜き直し、注釈はそのままに、離すともう一度翻訳します。</li>
  <li>向きが逆なら、キャプチャを開いたまま <kbd>F1</kbd> をもう一度押すと 2 つの言語が入れ替わります。</li>
</ol>
<p>Transeen は画面のピクセルを読むので、フルスクリーンのアプリやどの操作スペースでも、どのアプリでも同じように使えます。開いているメニューやツールチップも画像に残ります。最初からどのアプリでも使えるショートカットは <kbd>F1</kbd> だけです。翻訳せずに注釈だけ付けたいときは、メニューバーのメニューで <strong>注釈</strong> を選ぶか、設定 → ショートカット でキーを割り当てます。そのウインドウで <kbd>T</kbd> を押せば、あとから翻訳もできます。手元の画像を翻訳するには <strong>画像を開く…</strong> を選ぶか <kbd>⌘O</kbd> を押します。</p>
"""

[[guide.sections]]
id = "mark"
title = "注釈を付ける"
body = """
<p>ツールバーでツールを選ぶか、キーを押します：<kbd>R</kbd> 四角形、<kbd>O</kbd> 楕円、<kbd>A</kbd> 矢印、<kbd>P</kbd> ペン、<kbd>V</kbd> 選択と移動。描画ツールは、既存の注釈の上から描き始めても必ず描きます。注釈をつかむときは <kbd>V</kbd> を使います。番号は 1 から増えていき、取り消しややり直しをしても変わりません。</p>
<p>6 色と 3 種類の太さから選ぶか、スライダーで任意の色と 1〜10 の線の太さを選べます。<kbd>⌘Z</kbd> と <kbd>⌘⇧Z</kbd> で取り消しとやり直し、<kbd>Delete</kbd> で選択した注釈を削除します。注釈は別のレイヤーにあるので、原文と訳文を切り替えても動きません。</p>
"""

[[guide.sections]]
id = "keep"
title = "コピー、保存、ピン留め"
body = """
<ul>
  <li><kbd>⌘C</kbd> で、注釈を含めて見たままの画像をコピーします。翻訳の途中でも使えます。標準ではコピーするとキャプチャも閉じます。開いたままにするには、設定で <strong>コピー後にキャプチャを閉じる</strong> をオフにします。</li>
  <li><kbd>⌘S</kbd> で PNG に保存します。</li>
  <li><strong>画面にピン留め</strong> は、画像を独立した浮動ウインドウとして画面に残し、キャプチャを終えるので、すぐに次のキャプチャを始められます。ピンは切り替えた先のアプリの上にとどまります。どこにでもドラッグでき、いくつでも残せます。右クリックでコピー、保存、原文と訳文の切り替え、閉じるができます。</li>
  <li><strong>テキスト</strong> で、訳文の全文を原文と並べて開き、そのままコピーできます。</li>
</ul>
"""

[[guide.sections]]
id = "model"
title = "翻訳サービスを選ぶ"
body = """
<p>設定（<kbd>⌘,</kbd>）→ 一般 → 翻訳 で <strong>翻訳サービス</strong> を選びます。文字の認識は常に Mac 上で行います。</p>
<h3>Apple 翻訳（本機）</h3>
<p>標準の設定です。ステップ 4 の言語パックを使い、オフラインで動き、どこにも何も送りません。8 行ずつ翻訳するので、長いキャプチャも読み進めるうちに埋まっていきます。</p>
<h3>ローカル翻訳モデル</h3>
<p>Index-Translate 2B か Hy-MT2 1.8B（それぞれ約 1.1 GB）をダウンロードします。モデルは Transeen の中で動き、アカウントも追加のアプリもネットワークも要りません。Apple シリコン搭載の Mac が必要です。最初の翻訳ではモデルの読み込みに数秒かかり、5 分使わないとメモリを解放します。<strong>モデルを削除</strong> で取り除けます。</p>
<h3>LLM API</h3>
<p>OpenAI 互換の chat/completions エンドポイントなら何でも使えます。次の項目を入力します：</p>
<ul>
  <li><strong>エンドポイント</strong>：完全な URL。例 <code>https://api.openai.com/v1/chat/completions</code></li>
  <li><strong>モデル名</strong></li>
  <li>サービスが必要とする場合は API キーを入力して <strong>キーを保存</strong>。キーはキーチェーンに保存されます。<strong>接続をテスト</strong> で確認できます。</li>
</ul>
<p>自分の Mac で動かすサーバも使えます。ローカルのアドレスは HTTP のままでよく、キーも不要です。例えば Ollama なら <code>http://localhost:11434/v1/chat/completions</code>。リモートのアドレスには HTTPS が必要です。このモードで送るのは認識した文字だけで、スクリーンショットは送りません。リクエストが失敗すると、Transeen はエラーを表示して元の画像を残します。</p>
"""

[[guide.sections]]
id = "shortcuts"
title = "キーボードショートカット"
body = """
<div class="table-wrap">
  <table class="keys-table">
    <thead><tr><th scope="col">初期設定</th><th scope="col">操作</th></tr></thead>
    <tbody>
      <tr><td><kbd>F1</kbd></td><td>どのアプリからでも範囲を選んで翻訳</td></tr>
      <tr><td>範囲選択中に <kbd>R</kbd></td><td>前回のキャプチャの範囲をもう一度使う</td></tr>
      <tr><td>キャプチャを開いて <kbd>F1</kbd></td><td>言語を入れ替え、または「注釈」のキャプチャを翻訳</td></tr>
      <tr><td><kbd>Tab</kbd></td><td>原文と訳文を切り替え</td></tr>
      <tr><td><kbd>スペース</kbd> を押し続ける</td><td>原文をのぞく</td></tr>
      <tr><td><kbd>T</kbd></td><td>翻訳、または再試行</td></tr>
      <tr><td><kbd>D</kbd></td><td>言語を入れ替え</td></tr>
      <tr><td><kbd>R</kbd> <kbd>O</kbd> <kbd>A</kbd> <kbd>P</kbd></td><td>四角形、楕円、矢印、ペン</td></tr>
      <tr><td><kbd>V</kbd></td><td>注釈を選択して移動</td></tr>
      <tr><td><kbd>⌘C</kbd></td><td>画像をコピー</td></tr>
      <tr><td><kbd>⌘S</kbd></td><td>PNG に保存</td></tr>
      <tr><td><kbd>⌘Z</kbd> <kbd>⌘⇧Z</kbd></td><td>取り消す、やり直す</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>キャプチャを閉じる、または選択をキャンセル</td></tr>
      <tr><td><kbd>⌘O</kbd></td><td>画像を開く</td></tr>
      <tr><td><kbd>⌘,</kbd></td><td>設定を開く</td></tr>
    </tbody>
  </table>
</div>
<p>どれも 設定 → ショートカット で変えられ、<strong>すべてのショートカットを初期設定に戻す</strong> で元に戻せます。<strong>注釈</strong> と <strong>どこでも原文を表示</strong> は、そこで設定するまでキーがありません。グローバルショートカットには <kbd>⌘</kbd>、<kbd>⌥</kbd>、<kbd>⌃</kbd> のいずれか、または F キーが必要です。</p>
"""

[[guide.sections]]
id = "troubleshooting"
title = "困ったときは"
body = """
<h3>F1 を押しても何も起きない</h3>
<p>ノートパソコンのキーボードでは、<kbd>fn</kbd> を押さないと F1 は明るさの調整になります。または システム設定 → キーボード → キーボードショートカット → ファンクションキー で「F1、F2 などのキーを標準のファンクションキーとして使用」をオンにします。他のアプリが F1 を使っている場合もあり、ショートカットを登録できないときは Transeen が知らせます。設定 → ショートカット で別のキーを選ぶか、メニューバーのメニューの <strong>キャプチャして翻訳</strong> から始めてください。</p>
<h3>キャプチャが空になる、または許可を何度も求められる</h3>
<p>メニューバーのメニューで <strong>画面収録の許可…</strong> を開きます。システム設定ですでに Transeen がオンになっている場合は、いったんオフにしてからオンに戻し、<strong>開き直す</strong> を選びます。</p>
<h3>ウインドウの一部が黒くなる</h3>
<p>動画などを画面収録から保護しているアプリがあり、その部分はどのスクリーンショットでも黒く写ります。Transeen もその部分は読めず翻訳できませんが、範囲内のほかの部分はいつも通り翻訳されます。</p>
<h3>Apple 翻訳が始まらない</h3>
<p>その言語の組み合わせの言語パックがないか、ダウンロード中かもしれません。設定 → 一般 → 翻訳 でダウンロードするか、システム設定 → 一般 → 言語と地域 → 翻訳言語 を確認してから、もう一度試してください。</p>
<h3>ローカルモデルが起動しない</h3>
<p>一度やり直してください。それでもだめなら、設定 → 一般 → 翻訳 でモデルを削除してダウンロードし直します。チェックサムの検証に失敗したダウンロードは自動で削除されます。</p>
<h3>一部の文字がおかしく訳される</h3>
<p>込み入ったレイアウトや数式、専門用語は、認識や翻訳を誤らせることがあります。原文と比べる（<kbd>Tab</kbd>）、<strong>テキスト</strong> で全文を開く、範囲を小さくする、のいずれかを試してください。</p>
"""

[[guide.sections]]
id = "build"
title = "ソースからビルド"
body = """
<p>Transeen は <a href="https://github.com/LiuTianjie/Transeen/blob/main/LICENSE">MIT ライセンス</a>です。Xcode 26.4 以降、Swift 6、XcodeGen が必要です。</p>
<pre><code>brew install xcodegen
git clone https://github.com/LiuTianjie/Transeen.git
cd Transeen
./scripts/build.sh</code></pre>
<p>App は <code>dist/Transeen.app</code> に書き出されます。Developer ID がない場合はアドホック署名になります。署名付きでビルドするには <code>TRANSEEN_SIGNING_IDENTITY</code> を設定します。テストは <code>./scripts/test.sh</code>、<code>./scripts/test-license.sh</code>、<code>./scripts/test-lifecycle.sh</code> です。ホスト型のアクティベーションサービスは公式の App のものなので、独自に配布する場合は独自のライセンスバックエンドが必要です。</p>
"""
