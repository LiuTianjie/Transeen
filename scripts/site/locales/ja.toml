[faq]
fig = "よくある質問"
lede = "<b>よくある質問。</b>"

[[faq.items]]
q = "どのアプリで使えますか？"
a = "画面に文字を表示するアプリならどれでも。選んだ範囲のピクセルを翻訳するのでプラグインは不要で、ひとつの範囲で複数のアプリを囲めます。画面収録から保護された動画は、ほかのスクリーンショットと同じく黒く写ります。"

[[faq.items]]
q = "どの Mac で使えますか？"
a = "macOS 26 以降の Apple シリコン搭載 Mac と Intel Mac。ローカルモデルには Apple シリコンが必要です。"

[[faq.items]]
q = "オフラインで使えますか？"
a = "はい。アクティベートし、言語パックかモデルをダウンロードしておけば使えます。LLM API だけはネットワークが必要です。"

[[faq.items]]
q = "Mac の外に何が送られますか？"
a = "Apple 翻訳かローカルモデルなら何も送りません。LLM API では認識した文字だけを接続先に送り、スクリーンショットは送りません。"

[[faq.items]]
q = "別のモデルを使えますか？"
a = "はい。設定で Index-Translate 2B か Hy-MT2 1.8B をダウンロードするか、OpenAI 互換の API を入力します。キーはキーチェーンに保存されます。"

[[faq.items]]
q = "手元の画像も翻訳できますか？"
a = "はい。<kbd>⌘O</kbd> で開くと、同じツールが使えます。"

[[faq.items]]
q = "翻訳の精度は？"
a = "翻訳サービスによります。細かい点を頼りにする前に、<kbd>Tab</kbd> で原文を確かめてください。"

[[faq.items]]
q = "Transeen はオープンソースですか？"
a = "はい、<a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT ライセンス</a>です。公式の App には TR- コードが必要です。"

[[faq.items]]
q = "アップデートの方法は？"
a = "メニューバーで「アップデートを確認…」を選びます。"

