</div>
<p>每一項都能在設定 → 快速鍵中修改，<strong>恢復全部預設快速鍵</strong> 可以還原。<strong>截圖標註</strong> 和 <strong>全域對照原文</strong> 預設沒有按鍵，需要在那裡設定。全域快速鍵需要搭配 <kbd>⌘</kbd>、<kbd>⌥</kbd> 或 <kbd>⌃</kbd>，也可以用 F 功能鍵。</p>
"""

[[guide.sections]]
id = "troubleshooting"
title = "疑難排解"
body = """
<h3>按 F1 沒有反應</h3>
<p>在筆電鍵盤上，F1 預設是調整亮度，需要按住 <kbd>fn</kbd>，或在系統設定 → 鍵盤 → 鍵盤快速鍵 → 功能鍵中打開「將 F1、F2 等鍵作為標準功能鍵使用」。也可能是其他 App 佔用了 F1，Transeen 無法註冊快速鍵時會提示你。可以在設定 → 快速鍵中換一個鍵，或從選單列選單的 <strong>截圖翻譯</strong> 開始。</p>
<h3>截圖是空的，或一直要求授權</h3>
<p>打開選單列選單中的 <strong>螢幕權限…</strong>。如果系統設定裡 Transeen 已經是打開的，先關掉再打開，然後選擇 <strong>重新打開</strong>。</p>
<h3>視窗有一塊是黑的</h3>
<p>有些 App 會禁止螢幕錄製，保護影片等內容，這部分在任何截圖裡都是黑色。Transeen 讀不到也翻譯不了這部分，框裡的其他內容照常翻譯。</p>
<h3>Apple 翻譯沒有開始</h3>
<p>這組語言的語言包可能還沒下載或正在下載。在設定 → 一般 → 翻譯中下載，或到系統設定 → 一般 → 語言與地區 → 翻譯語言中查看，然後再試一次。</p>
<h3>本機模型無法啟動</h3>
<p>先重試一次。還是不行的話，在設定 → 一般 → 翻譯中刪除模型後重新下載；驗證失敗的下載會自動刪除。</p>
<h3>部分文字翻得不對</h3>
<p>密集的版面、公式和專業術語可能讓辨識或翻譯出錯。按 <kbd>Tab</kbd> 對照原文，打開 <strong>文字</strong> 查看完整譯文，或框選小一點的區域。</p>
"""

[[guide.sections]]
id = "build"
title = "從原始碼建置"
body = """
<p>Transeen 以 <a href="https://github.com/LiuTianjie/Transeen/blob/main/LICENSE">MIT 授權條款</a>開源。需要 Xcode 26.4 或更新版本、Swift 6 和 XcodeGen。</p>
<pre><code>brew install xcodegen
git clone https://github.com/LiuTianjie/Transeen.git
cd Transeen
./scripts/build.sh</code></pre>
<p>App 會產生在 <code>dist/Transeen.app</code>。沒有 Developer ID 憑證時會使用臨時簽署；設定 <code>TRANSEEN_SIGNING_IDENTITY</code> 可以產生正式簽署的版本。測試指令碼是 <code>./scripts/test.sh</code>、<code>./scripts/test-license.sh</code> 和 <code>./scripts/test-lifecycle.sh</code>。代管的啟用服務只屬於官方版本，獨立發行需要自己的授權後端。</p>
"""
