[guide.howto]
name = "如何用 Transeen 在 Mac 上截圖翻譯"
supply = "一組 TR- 啟用碼"
tools = ["一台 macOS 26 或更新版本的 Mac", "Transeen"]
steps = [
  { name = "安裝", text = "從 GitHub Releases 下載 DMG，把 Transeen 拖進「應用程式」並打開。它常駐在選單列。" },
  { name = "啟用", text = "在選單列選單中選擇「啟用與帳號…」，輸入 TR- 啟用碼，選擇「啟用這台 Mac」。" },
  { name = "開啟螢幕錄製", text = "在系統設定 → 隱私權與安全性 → 螢幕與系統音訊錄製中打開 Transeen。" },
