[faq]
fig = "常見問題"
lede = "<b>常見問題。</b>"

[[faq.items]]
q = "支援哪些 App？"
a = "螢幕上會顯示文字的 App 都可以。Transeen 翻譯的是你框住的像素，不需要外掛，一個框還能同時框住好幾個 App。被 App 禁止螢幕錄製的影片會顯示成黑色，任何截圖都一樣。"

[[faq.items]]
q = "支援哪些 Mac？"
a = "macOS 26 或更新版本，Apple 晶片和 Intel 都支援。本機模型需要 Apple 晶片。"

[[faq.items]]
q = "可以離線使用嗎？"
a = "可以，啟用並下載好語言包或模型之後就行。只有大模型介面需要連網。"

[[faq.items]]
q = "哪些資料會離開我的 Mac？"
a = "使用 Apple 翻譯或本機模型時，什麼都不會。使用大模型介面時，只把辨識出的文字傳到你設定的位址，從不傳送截圖。"

[[faq.items]]
q = "可以換別的模型嗎？"
a = "可以：在設定裡下載 Index-Translate 2B 或 Hy-MT2 1.8B，或填寫任何相容 OpenAI 的介面。金鑰存在鑰匙圈裡。"

[[faq.items]]
q = "能翻譯已經有的圖片嗎？"
a = "可以。按 <kbd>⌘O</kbd> 打開，工具完全一樣。"

[[faq.items]]
q = "翻譯準確嗎？"
a = "取決於翻譯服務。在依賴某個細節之前，按 <kbd>Tab</kbd> 對照一下原文。"

[[faq.items]]
q = "Transeen 開源嗎？"
a = "開源，採用 <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT 授權條款</a>。官方 App 需要 TR- 啟用碼。"

[[faq.items]]
q = "怎麼更新？"
a = "在選單列選擇「檢查更新…」。"

