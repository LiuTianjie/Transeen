body = """
<ol>
  <li>從 <a href="https://github.com/LiuTianjie/Transeen/releases/latest">GitHub Releases</a> 下載最新的 DMG。大約 {about} MB，一個通用版本同時支援 Apple 晶片和 Intel。</li>
  <li>打開 DMG，把 Transeen 拖進「應用程式」。</li>
  <li>從「應用程式」打開 Transeen。它常駐在選單列，不在 Dock 裡，請在選單列找它的圖像。</li>
</ol>
<p>App 和 DMG 都以 Developer ID 簽署並通過 Apple 公證，macOS 打開時不會跳出警告。同一個發布頁還有 ZIP 和 SHA-256 檢查碼。介面語言會跟隨系統：简体中文、繁體中文、English、日本語、한국어、Français、Español、Deutsch。</p>
"""

[[guide.sections]]
id = "activate"
title = "啟用"
body = """
<ol>
  <li>在選單列選單中選擇 <strong>啟用與帳號…</strong>，或在主視窗中選擇 <strong>啟用 Transeen</strong>。</li>
  <li>輸入啟用碼，格式是 <code>TR-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX</code>，然後選擇 <strong>啟用這台 Mac</strong>。不需要登入。</li>
  <li>如果願意，可以用 Google、GitHub 或電子郵件登入 iTool 帳號並綁定授權。之後登入同一個帳號就能恢復。</li>
</ol>
<p>啟用只會在鑰匙圈裡保存一個隨機安裝 ID 和一份憑證，不會讀取 Mac 的序號。一組啟用碼對應一台 Mac，綁定帳號不會多出一份授權。StupidMirror 的 SM- 和 iTool Pro 的 IT- 啟用碼屬於其他產品，在這裡不能用。想要啟用碼，請<a href="https://github.com/LiuTianjie/Transeen/discussions">到 GitHub Discussions 留言</a>。</p>
"""

[[guide.sections]]
id = "permission"
title = "開啟螢幕錄製"
body = """
<p>第一次截圖時，Transeen 會要求螢幕錄製權限。它只使用螢幕畫面，不錄音，而且只在你按下截圖快速鍵時才擷取。它不保存紀錄，也從不持續錄影。</p>
<ol>
  <li>選擇 <strong>打開系統設定…</strong>，或前往系統設定 → 隱私權與安全性 → 螢幕與系統音訊錄製。</li>
  <li>找到 Transeen 並打開開關。</li>
  <li>回到 Transeen。它會自動重新檢查並顯示 <strong>已準備好</strong>，選擇 <strong>開始框選</strong> 繼續。</li>
</ol>
<p>如果開關已經打開卻還是沒有作用，在同一個視窗裡點 <strong>重新檢查</strong> 或 <strong>重新打開</strong>。</p>
"""

[[guide.sections]]
id = "languages"
title = "選擇語言"
body = """
<p>主視窗有兩個選單：<strong>原文語言</strong> 和 <strong>譯文語言</strong>。原文可以維持 <strong>自動識別</strong>，也可以從八種語言中選一種：簡體中文、繁體中文、英文、日文、韓文、法文、西班牙文、德文。任兩種之間都能互譯。</p>
<p>截圖打開時，工具下方的方向（例如 JA → 繁中）可以改任一邊的語言；再按一次 <kbd>F1</kbd> 就交換兩邊。</p>
<p>Apple 翻譯的每一組語言都需要語言包。第一次啟動時的導覽，以及之後的設定 → 一般 → 翻譯，會列出譯文語言需要的語言包和狀態。點 <strong>下載</strong> 先裝好，第一次截圖就不用等；之後翻譯完全在本機離線完成。語言包也可以在系統設定 → 一般 → 語言與地區 → 翻譯語言中查看。</p>
"""

[[guide.sections]]
id = "translate"
title = "框選翻譯"
body = """
<ol>
  <li>在任何 App 裡按 <kbd>F1</kbd>。螢幕會定格並變暗。在筆電鍵盤上是 <kbd>fn</kbd> <kbd>F1</kbd>，除非你把 F 鍵設成了標準功能鍵。</li>
  <li>移動游標會自動吸附到段落、輸入欄位或視窗，點一下即可；也可以自己拖一個框，一個框可以跨過好幾個 App 的視窗。<kbd>Esc</kbd> 或按右鍵取消。</li>
  <li>和上次同一個位置？框選時按 <kbd>R</kbd>，直接沿用上一次截圖的區域，重新開機後也有效。</li>
  <li>譯文會出現在原文所在的位置，一行翻好就顯示一行。按 <kbd>Tab</kbd> 在原文和譯文之間切換，按住 <kbd>空白鍵</kbd> 暫時看原文。</li>
  <li>少框了一點？拖動截圖的邊或角。它會從同一張定格畫面重新裁切，標註留在原處，放開後重新翻譯。</li>
  <li>方向反了？截圖打開時再按一次 <kbd>F1</kbd>，兩種語言會對調。</li>
</ol>
<p>Transeen 讀的是螢幕像素，所以在每個 App 裡用法都一樣，全螢幕 App 和每個桌面也包括在內，開著的選單或提示也會留在畫面裡。<kbd>F1</kbd> 是預設唯一在任何 App 裡都能用的快速鍵。只想截圖標註、不翻譯，可以在選單列選單中選擇 <strong>截圖標註</strong>，或在設定 → 快速鍵中替它指定一個鍵；在那個視窗裡按 <kbd>T</kbd> 仍然可以翻譯。要翻譯已經有的圖片，選擇 <strong>打開圖片…</strong> 或按 <kbd>⌘O</kbd>。</p>
"""

[[guide.sections]]
id = "mark"
title = "標註"
body = """
<p>在工具列選工具，或直接按鍵：<kbd>R</kbd> 矩形、<kbd>O</kbd> 橢圓、<kbd>A</kbd> 箭頭、<kbd>P</kbd> 畫筆、<kbd>V</kbd> 選擇與移動。繪圖工具一按就畫，從現有的標註上起筆也一樣；要拿起某個標註，請用 <kbd>V</kbd>。編號標註從 1 開始遞增，還原和重做後編號不變。</p>
<p>有六種顏色和三種粗細可選，也可以打開滑桿選任何顏色和 1 到 10 的線寬。<kbd>⌘Z</kbd> 和 <kbd>⌘⇧Z</kbd> 還原、重做，<kbd>Delete</kbd> 刪除選取的標註。標註在獨立的圖層上，切換原文和譯文時不會移動。</p>
"""

[[guide.sections]]
id = "keep"
title = "拷貝、儲存或釘圖"
body = """
<ul>
  <li><kbd>⌘C</kbd> 依照你看到的樣子拷貝圖片，包含標註，即使譯文還在產生也可以。預設拷貝後會關閉截圖；在設定中關掉 <strong>拷貝後關閉截圖</strong> 就能保留。</li>
  <li><kbd>⌘S</kbd> 存成 PNG。</li>
  <li><strong>釘到螢幕</strong> 把圖片留在螢幕上，成為一個獨立的浮動視窗，同時結束這次截圖，馬上可以截下一張。釘圖會停在你切換到的 App 上方，可以拖到任何地方，想留幾張都行；按右鍵可以拷貝、儲存、切換原文和譯文或關閉。</li>
  <li><strong>文字</strong> 打開完整譯文，與原文並排，方便拷貝。</li>
</ul>
"""

[[guide.sections]]
id = "model"
title = "選擇翻譯服務"
body = """
<p>打開設定（<kbd>⌘,</kbd>）→ 一般 → 翻譯，選擇 <strong>翻譯服務</strong>。文字辨識一律在本機完成。</p>
<h3>Apple 本機翻譯</h3>
<p>預設選項。使用第 4 步的語言包，離線執行，不會把內容傳到任何地方。文字每 8 行一組翻譯，長截圖會邊看邊補滿。</p>
<h3>本機翻譯模型</h3>
<p>下載 Index-Translate 2B 或 Hy-MT2 1.8B，每個約 1.1 GB。模型在 Transeen 內部執行，不需要帳號、不需要另外安裝 App，也不連網。需要 Apple 晶片的 Mac。第一次翻譯要花幾秒載入模型，閒置 5 分鐘後會自動釋放記憶體。<strong>刪除模型</strong> 可以再把它移除。</p>
<h3>大模型介面</h3>
<p>任何相容 OpenAI 的 chat/completions 介面。依序填寫：</p>
<ul>
  <li><strong>介面位址</strong>，完整的 URL，例如 <code>https://api.openai.com/v1/chat/completions</code>；</li>
  <li><strong>模型名稱</strong>；</li>
  <li>服務需要時填寫 API Key，然後點 <strong>儲存金鑰</strong>，它會存進鑰匙圈。<strong>測試連線</strong> 可以檢查能不能用。</li>
</ul>
<p>本機上的服務也可以：本機位址可以用 HTTP，也不需要金鑰，例如 Ollama 的 <code>http://localhost:11434/v1/chat/completions</code>。遠端位址必須使用 HTTPS。這種方式只傳送辨識出的文字，從不傳送截圖。請求失敗時，Transeen 會顯示錯誤並保留原圖。</p>
"""

