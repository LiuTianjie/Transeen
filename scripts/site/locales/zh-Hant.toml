      <tr><td>截圖打開時按 <kbd>F1</kbd></td><td>交換語言，或翻譯「截圖標註」的截圖</td></tr>
      <tr><td><kbd>Tab</kbd></td><td>切換原文和譯文</td></tr>
      <tr><td>按住 <kbd>空白鍵</kbd></td><td>暫時查看原文</td></tr>
      <tr><td><kbd>T</kbd></td><td>翻譯或重試</td></tr>
      <tr><td><kbd>D</kbd></td><td>交換語言</td></tr>
      <tr><td><kbd>R</kbd> <kbd>O</kbd> <kbd>A</kbd> <kbd>P</kbd></td><td>矩形、橢圓、箭頭、畫筆</td></tr>
      <tr><td><kbd>V</kbd></td><td>選擇與移動標註</td></tr>
      <tr><td><kbd>⌘C</kbd></td><td>拷貝圖片</td></tr>
      <tr><td><kbd>⌘S</kbd></td><td>存成 PNG</td></tr>
