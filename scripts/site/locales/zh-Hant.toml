[faq]
fig = "常見問題"
lede = "<b>常見問題。</b>還有其他問題，歡迎到 GitHub Discussions 提問。"

[[faq.items]]
q = "支援哪些 App？"
a = "螢幕上會顯示文字的 App 都可以：瀏覽器、聊天和郵件、PDF 閱讀器、遊戲、設計與影片工具、遠端桌面和虛擬機器。Transeen 翻譯的是你框住的像素，不需要外掛，也不需要 App 本身支援；一個框還能同時框住好幾個 App 的視窗。被 App 設為禁止螢幕錄製的影片會顯示成黑色，任何截圖都一樣。"

[[faq.items]]
q = "Transeen 支援哪些 Mac？"
a = "需要 macOS 26 或更新版本，Apple 晶片和 Intel 都支援，是同一個通用 App；本機翻譯模型需要 Apple 晶片。App 介面會跟隨你選的母語，可選简体中文、繁體中文、English、日本語、한국어、Français、Español 和 Deutsch。"

[[faq.items]]
q = "可以離線使用嗎？"
a = "可以，啟用之後就行。下載好語言包或本機模型後，截圖、標註、Apple 翻譯和本機模型都能離線執行。斷網時授權依然有效，大約每天重新驗證一次。大模型介面需要連線到你設定的位址。"

[[faq.items]]
q = "哪些資料會離開我的 Mac？"
a = "使用 Apple 翻譯或本機模型時，沒有：截圖、辨識出的文字和譯文都留在這台 Mac 上。使用大模型介面時，只會把辨識出的文字傳送到你設定的位址，不會傳送截圖。啟用時會傳送啟用碼和一個隨機安裝 ID，檢查更新會連到 GitHub。"

[[faq.items]]
q = "可以換別的模型嗎？"
a = "可以。在 設定 → 一般 → 翻譯 裡下載 Index-Translate 2B 或 Hy-MT2 1.8B（各約 1.1 GB），由 Transeen 自己在本機執行；也可以填寫任何相容 OpenAI 的 chat/completions 位址和模型名稱，需要時再填金鑰，金鑰會存在鑰匙圈中。遠端位址必須使用 HTTPS；本機 localhost 上的服務可以用 HTTP，也可以不填金鑰。"

[[faq.items]]
q = "能翻譯已經有的圖片嗎？"
a = "可以。在啟動面板選擇「打開圖片…」或按 <kbd>⌘O</kbd>，圖片會在同樣的視窗裡打開，工具也完全一樣。"

[[faq.items]]
q = "翻譯準確嗎？"
a = "取決於所選的翻譯服務。密集的版面、公式和專業術語可能需要修正；在依賴某個細節之前，請按 <kbd>Tab</kbd> 對照原文，或打開完整譯文核對。"

[[faq.items]]
q = "Transeen 開源嗎？"
a = "開源，採用 <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT 授權條款</a>，允許商業使用。官方 App 需要 TR- 啟用碼；原始碼授權不包含代管的啟用服務，獨立建置需要設定自己的授權後端。"

[[faq.items]]
q = "怎麼更新？"
a = "在選單列或啟動面板選擇「檢查更新…」。Transeen 會查看 GitHub Releases，有新版本時打開下載頁面。"

