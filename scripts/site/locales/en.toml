[faq]
fig = "Questions"
lede = "<b>Questions.</b> Anything else, ask in GitHub Discussions."

[[faq.items]]
q = "Which apps does it work with?"
a = "Any app that shows text on the screen: browsers, chat and mail, PDF readers, games, design and video tools, remote desktops and virtual machines. Transeen translates the pixels you select, so it needs no plug-in or support from the app, and one frame can take in windows from several apps. Video that an app protects from screen recording comes out black, as it does in any screenshot."

[[faq.items]]
q = "Which Macs does Transeen run on?"
a = "macOS 26 or later, on Apple silicon or Intel: it is one universal app. The local translation models need Apple silicon. The interface follows your language: English, 简体中文, 繁體中文, 日本語, 한국어, Français, Español or Deutsch."

[[faq.items]]
q = "Does it work offline?"
a = "Yes, once it is activated. Capture, annotation, Apple Translation and the local models work offline after their language packs or model are downloaded. An activation stays valid through network outages and is checked again about once a day. An LLM API needs a connection to your endpoint."

[[faq.items]]
q = "What leaves my Mac?"
a = "With Apple Translation or a local model, nothing: the screenshot, the recognized text and the translation stay on this Mac. With an LLM API only the recognized text goes to the endpoint you set, never the screenshot. Activation sends your code and a random installation ID, and update checks contact GitHub."

[[faq.items]]
q = "Can I use a different model?"
a = "Yes. In Settings → General → Translation, download Index-Translate 2B or Hy-MT2 1.8B (about 1.1 GB each), which run inside Transeen, or enter any OpenAI-compatible chat/completions endpoint, a model name and, if it needs one, a key kept in your Keychain. Remote endpoints must use HTTPS; a server on localhost can use HTTP without a key."

[[faq.items]]
q = "Can it translate an image I already have?"
a = "Yes. Choose Open Image… in the launcher or press <kbd>⌘O</kbd>; the picture opens in the same window, with the same tools."

[[faq.items]]
q = "How accurate is it?"
a = "That depends on the translation service. Dense layouts, formulas and specialist terms can need correcting, so compare with the original using <kbd>Tab</kbd>, or open the full text, before you rely on a detail."

[[faq.items]]
q = "Is Transeen open source?"
a = "Yes, under the <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT license</a>, commercial use included. The official app needs a TR- code; the source license does not include the hosted activation service, so independent builds bring their own."

[[faq.items]]
q = "How do I update?"
a = "Choose Check for Updates… in the menu bar or the launcher. Transeen checks GitHub Releases and opens the download when a newer version exists."

