[[guide.sections]]
id = "install"
title = "Install"
body = """
<ol>
  <li>Download the latest DMG from <a href="https://github.com/LiuTianjie/Transeen/releases/latest">GitHub Releases</a>. It is about {about} MB, one universal app for Apple silicon and Intel.</li>
  <li>Open the DMG and drag Transeen to Applications.</li>
  <li>Open Transeen from Applications. It lives in the menu bar, so look for its icon there rather than in the Dock.</li>
</ol>
<p>The app and the DMG are signed with a Developer ID and notarized by Apple, so macOS opens them without a warning. A ZIP and SHA-256 checksums are on the same release page. The interface follows your Mac’s language: English, 简体中文, 繁體中文, 日本語, 한국어, Français, Español or Deutsch.</p>
"""

[[guide.sections]]
id = "activate"
title = "Activate"
body = """
<ol>
  <li>Choose <strong>Activation &amp; Account…</strong> in the menu bar menu, or <strong>Activate Transeen</strong> in the home window.</li>
  <li>Enter your code, which looks like <code>TR-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX</code>, and choose <strong>Activate This Mac</strong>. No sign-in is needed.</li>
  <li>If you like, sign in to an iTool account with Google, GitHub or email and link the license. Signing in to the same account later restores it.</li>
</ol>
<p>Activation keeps a random installation ID and a receipt in your Keychain; it never reads your Mac’s serial number. One code covers one Mac, and linking an account does not create a second license. StupidMirror SM- and iTool Pro IT- codes are separate products and don’t work here. To get a code, <a href="https://github.com/LiuTianjie/Transeen/discussions">ask in GitHub Discussions</a>.</p>
"""

[[guide.sections]]
id = "permission"
title = "Allow screen recording"
body = """
<p>The first time you capture, Transeen asks for the Screen Recording permission. It uses the screen image only, never audio, and only when you press a capture shortcut. It keeps no history and never records continuously.</p>
<ol>
  <li>Choose <strong>Open System Settings…</strong>, or go to System Settings → Privacy &amp; Security → Screen &amp; System Audio Recording.</li>
  <li>Find Transeen and turn it on.</li>
  <li>Come back to Transeen. It checks again by itself and shows <strong>All Set</strong>; choose <strong>Select an Area</strong> to carry on.</li>
</ol>
<p>If it is on but still not working, use <strong>Check Again</strong> or <strong>Reopen</strong> in the same window.</p>
"""

[[guide.sections]]
id = "languages"
title = "Choose languages"
body = """
<p>The home window has two menus, <strong>Source Language</strong> and <strong>Target Language</strong>. Leave the source on <strong>Auto Detect</strong> or choose one of the eight languages: Simplified Chinese, Traditional Chinese, English, Japanese, Korean, French, Spanish and German. Any of them translates into any other.</p>
<p>On an open capture, the direction under the tools (for example JA → EN) changes either language, and pressing <kbd>F1</kbd> again swaps them.</p>
<p>Apple Translation needs a language pack for each pair. The guide that opens on first launch, and Settings → General → Translation later, list the packs for your target language with their status. <strong>Download</strong> fetches one before your first capture needs it; after that the translation runs on your Mac, offline. Packs are also listed in System Settings → General → Language &amp; Region → Translation Languages.</p>
"""

[[guide.sections]]
id = "translate"
title = "Translate a region"
body = """
<ol>
  <li>In any app, press <kbd>F1</kbd>. The screen holds still and dims. On a laptop keyboard that is <kbd>fn</kbd> <kbd>F1</kbd>, unless the F keys work as standard function keys.</li>
  <li>Hover to snap to a paragraph, a field or a window and click, or drag a frame of your own. A frame can cover windows from several apps. <kbd>Esc</kbd> or a right click cancels.</li>
  <li>Same place as last time? Press <kbd>R</kbd> while selecting and the last capture’s area is taken again, even after a restart.</li>
  <li>Read the translation where the text was. Lines appear as they are translated. Press <kbd>Tab</kbd> to switch to the original and back, or hold <kbd>Space</kbd> to peek at it.</li>
  <li>Missed a bit? Drag an edge or corner of the capture. It re-crops from the same frozen screen, keeps your marks in place and translates again when you let go.</li>
  <li>Wrong way round? Press <kbd>F1</kbd> again while the capture is open and the two languages swap.</li>
</ol>
<p>Transeen reads the pixels on the screen, so it works the same in every app, full-screen apps and every Space included, and an open menu or tooltip stays in the picture. <kbd>F1</kbd> is the only shortcut that works from any app out of the box. To capture for marking up without translating, choose <strong>Markup</strong> in the menu bar menu, or give it a key in Settings → Shortcuts; press <kbd>T</kbd> in that window if you want the translation after all. To translate a picture you already have, choose <strong>Open Image…</strong> or press <kbd>⌘O</kbd>.</p>
"""

[[guide.sections]]
id = "mark"
title = "Mark it up"
body = """
<p>Choose a tool on the toolbar or press its key: <kbd>R</kbd> for a rectangle, <kbd>O</kbd> for an ellipse, <kbd>A</kbd> for an arrow, <kbd>P</kbd> for the pen and <kbd>V</kbd> to select and move. A drawing tool always draws, even when you start on an existing mark; use <kbd>V</kbd> to pick a mark up. Numbered notes count up from 1 and keep their numbers through undo and redo.</p>
<p>Pick one of six colors and three widths, or open the sliders for any color and a width from 1 to 10. <kbd>⌘Z</kbd> and <kbd>⌘⇧Z</kbd> undo and redo; <kbd>Delete</kbd> removes the selected mark. Marks sit on their own layer, so switching between original and translation never moves them.</p>
"""

[[guide.sections]]
id = "keep"
title = "Copy, save or pin"
body = """
<ul>
  <li><kbd>⌘C</kbd> copies the picture as you see it, marks included, even while a translation is still running. By default this also closes the capture; turn off <strong>Close capture after copying</strong> in Settings to keep it open.</li>
  <li><kbd>⌘S</kbd> saves it as a PNG.</li>
  <li><strong>Pin to Screen</strong> leaves the picture on the screen as a floating window of its own and ends the capture, so the next one can start straight away. A pin stays above the app you switch to. Drag it anywhere and keep as many as you need; right-click one to copy, save, switch between original and translation or close it.</li>
  <li><strong>Text</strong> opens the full translation next to the original, ready to copy.</li>
</ul>
"""

[[guide.sections]]
id = "model"
title = "Pick a translation service"
body = """
<p>Open Settings (<kbd>⌘,</kbd>) → General → Translation and choose a <strong>Translation Service</strong>. Text recognition always happens on your Mac.</p>
<h3>Apple Translation (on device)</h3>
<p>The default. It uses the language packs from step 4, runs offline and sends nothing anywhere. Lines are translated in groups of eight, so a long capture fills in as you read.</p>
<h3>Local Translation Model</h3>
<p>Download Index-Translate 2B or Hy-MT2 1.8B, about 1.1 GB each. The model runs inside Transeen, with no account, no extra app and no network. It needs a Mac with Apple silicon. The first translation takes a few seconds to load the model, and its memory is freed after five idle minutes. <strong>Delete Model</strong> removes it again.</p>
<h3>LLM API</h3>
<p>Any OpenAI-compatible chat/completions endpoint. Fill in:</p>
<ul>
  <li><strong>Endpoint</strong>, the full URL, for example <code>https://api.openai.com/v1/chat/completions</code>;</li>
  <li><strong>Model Name</strong>;</li>
  <li>the API key, if the service needs one, then <strong>Save Key</strong>. It is stored in your Keychain. <strong>Test Connection</strong> checks it.</li>
</ul>
<p>A server on your own Mac works too: local addresses may use plain HTTP and need no key, for example <code>http://localhost:11434/v1/chat/completions</code> for Ollama. Remote addresses must use HTTPS. This mode sends only the recognized text, never the screenshot. If a request fails, Transeen shows the error and keeps the original picture.</p>
"""

