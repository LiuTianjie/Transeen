  </table>
</div>
<p>Change any of them in Settings → Shortcuts; <strong>Restore All Default Shortcuts</strong> puts them back. <strong>Markup</strong> and <strong>Show Original Anywhere</strong> have no key until you set one there. Global shortcuts need <kbd>⌘</kbd>, <kbd>⌥</kbd> or <kbd>⌃</kbd>, or an F key.</p>
"""

[[guide.sections]]
id = "troubleshooting"
title = "Troubleshooting"
body = """
<h3>Nothing happens when I press F1</h3>
<p>On a laptop keyboard F1 changes the brightness unless you hold <kbd>fn</kbd>, or turn on “Use F1, F2, etc. keys as standard function keys” in System Settings → Keyboard → Keyboard Shortcuts → Function Keys. Another app may also hold F1; Transeen tells you when it cannot register a shortcut. Choose a different key in Settings → Shortcuts, or start from <strong>Capture &amp; Translate</strong> in the menu bar menu.</p>
<h3>The capture is empty or the permission keeps asking</h3>
<p>Open <strong>Screen Permission…</strong> in the menu bar menu. If System Settings already shows Transeen turned on, turn it off and on again, then choose <strong>Reopen</strong>.</p>
<h3>Part of a window comes out black</h3>
<p>Some apps protect video and other content from screen recording, and it is captured as black in any screenshot. Transeen can’t read or translate that part; everything else in the frame still works.</p>
<h3>Apple Translation does not start</h3>
<p>The language pack for that pair may be missing or still downloading. Download it in Settings → General → Translation, or check System Settings → General → Language &amp; Region → Translation Languages, and try again.</p>
<h3>The local model doesn’t start</h3>
<p>Try again once. If it still fails, delete the model in Settings → General → Translation and download it again; a download that fails its checksum is deleted for you.</p>
<h3>Some text comes out wrong</h3>
<p>Dense layouts, formulas and specialist terms can trip up recognition or translation. Compare with the original (<kbd>Tab</kbd>), open <strong>Text</strong> for the full translation, or select a smaller region.</p>
"""

[[guide.sections]]
id = "build"
title = "Build from source"
body = """
<p>Transeen is <a href="https://github.com/LiuTianjie/Transeen/blob/main/LICENSE">MIT licensed</a>. You need Xcode 26.4 or later, Swift 6 and XcodeGen.</p>
<pre><code>brew install xcodegen
git clone https://github.com/LiuTianjie/Transeen.git
cd Transeen
./scripts/build.sh</code></pre>
<p>The app is written to <code>dist/Transeen.app</code>. Without a Developer ID identity the build is signed ad hoc; set <code>TRANSEEN_SIGNING_IDENTITY</code> for a signed build. The tests are <code>./scripts/test.sh</code>, <code>./scripts/test-license.sh</code> and <code>./scripts/test-lifecycle.sh</code>. The official app checks the iTool membership, so an independent distribution needs its own account backend.</p>
"""
