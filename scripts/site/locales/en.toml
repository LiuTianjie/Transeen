lede = "<b>Questions.</b>"

[[faq.items]]
q = "Which apps does it work with?"
a = "Any app that shows text on the screen. Transeen translates the pixels you select, so it needs no plug-in, and one frame can cover several apps. Video an app protects from screen recording comes out black, as in any screenshot."

[[faq.items]]
q = "Which Macs does it run on?"
a = "macOS 26 or later, on Apple silicon or Intel. The local models need Apple silicon."

[[faq.items]]
q = "Does it work offline?"
a = "Yes, once activated and once the language pack or model is downloaded. Only an LLM API needs a connection."

[[faq.items]]
q = "What leaves my Mac?"
a = "With Apple Translation or a local model, nothing. With an LLM API, only the recognized text goes to your endpoint, never the screenshot."

[[faq.items]]
q = "Can I use a different model?"
a = "Yes: download Index-Translate 2B or Hy-MT2 1.8B in Settings, or enter any OpenAI-compatible endpoint. Keys stay in your Keychain."

[[faq.items]]
q = "Can it translate an image I already have?"
a = "Yes. Press <kbd>⌘O</kbd> and it opens with the same tools."

[[faq.items]]
q = "How accurate is it?"
a = "It depends on the translation service. Press <kbd>Tab</kbd> to check the original before you rely on a detail."

[[faq.items]]
q = "Is Transeen open source?"
a = "Yes, under the <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT license</a>. The official app needs a TR- code."

[[faq.items]]
