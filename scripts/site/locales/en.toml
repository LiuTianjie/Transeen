      <tr><td><kbd>Tab</kbd></td><td>Switch original and translation</td></tr>
      <tr><td>Hold <kbd>Space</kbd></td><td>Peek at the original</td></tr>
      <tr><td><kbd>T</kbd></td><td>Translate, or try again</td></tr>
      <tr><td><kbd>D</kbd></td><td>Swap the languages</td></tr>
      <tr><td><kbd>R</kbd> <kbd>O</kbd> <kbd>A</kbd> <kbd>P</kbd></td><td>Rectangle, ellipse, arrow, pen</td></tr>
      <tr><td><kbd>V</kbd></td><td>Select and move marks</td></tr>
      <tr><td><kbd>⌘C</kbd></td><td>Copy the picture</td></tr>
