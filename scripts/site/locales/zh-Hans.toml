[faq]
fig = "常见问题"
lede = "<b>常见问题。</b>还有别的，到 GitHub Discussions 提问。"

[[faq.items]]
q = "支持哪些软件？"
a = "屏幕上显示文字的软件都行：浏览器、聊天和邮件、PDF 阅读器、游戏、设计和视频工具、远程桌面和虚拟机。Transeen 翻译的是你框住的像素，不需要插件，也不需要软件本身支持；一个框还可以同时框住几个软件的窗口。被软件设为禁止录屏的视频会显示成黑色，任何截图都一样。"

[[faq.items]]
q = "Transeen 支持哪些 Mac？"
a = "需要 macOS 26 或更高版本，Apple 芯片和 Intel 都支持，是同一个通用应用；本地翻译模型需要 Apple 芯片。应用界面跟随你选的母语，可选简体中文、繁體中文、English、日本語、한국어、Français、Español 和 Deutsch。"

[[faq.items]]
q = "可以离线使用吗？"
a = "可以，激活之后即可。下载好语言包或本地模型后，截图、标注、Apple 翻译和本地模型都能离线运行。断网时授权依然有效，大约每天重新校验一次。大模型接口需要连接你设置的地址。"

[[faq.items]]
q = "哪些数据会离开我的 Mac？"
a = "使用 Apple 翻译或本地模型时，没有：截图、识别出的文字和译文都留在这台 Mac 上。使用大模型接口时，只把识别出的文字发送到你设置的地址，不发送截图。激活时会发送激活码和一个随机安装 ID，检查更新会访问 GitHub。"

[[faq.items]]
q = "可以换别的模型吗？"
a = "可以。在 设置 → 通用 → 翻译 里下载 Index-Translate 2B 或 Hy-MT2 1.8B（各约 1.1 GB），由 Transeen 自己在本机运行；也可以填写任意兼容 OpenAI 的 chat/completions 地址和模型名，需要时再填密钥，密钥保存在钥匙串中。远端地址必须使用 HTTPS；本机 localhost 上的服务可以用 HTTP，也可以不填密钥。"

[[faq.items]]
q = "能翻译已有的图片吗？"
a = "可以。在启动面板选择“打开图片…”或按 <kbd>⌘O</kbd>，图片会在同样的窗口里打开，工具也完全一样。"

[[faq.items]]
q = "翻译准确吗？"
a = "取决于所选的翻译服务。密集排版、公式和专业术语可能需要修正；依赖某个细节之前，请按 <kbd>Tab</kbd> 对照原文，或打开完整译文核对。"

[[faq.items]]
q = "Transeen 开源吗？"
a = "开源，采用 <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT 许可证</a>，允许商业使用。官方应用需要 TR- 激活码；源码许可证不包含托管的激活服务，独立构建需要配置自己的授权后端。"

[[faq.items]]
q = "怎么更新？"
a = "在菜单栏或启动面板选择“检查更新…”。Transeen 会查看 GitHub Releases，有新版本时打开下载页面。"

