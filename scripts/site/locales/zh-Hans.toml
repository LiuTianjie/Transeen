[faq]
fig = "常见问题"
lede = "<b>常见问题。</b>"

[[faq.items]]
q = "支持哪些软件？"
a = "屏幕上显示文字的软件都行。Transeen 翻译的是你框住的像素，不需要插件，一个框还能同时框住几个软件。被软件禁止录屏的视频会显示成黑色，任何截图都一样。"

[[faq.items]]
q = "支持哪些 Mac？"
a = "macOS 26 或更高版本，Apple 芯片和 Intel 都支持。本地模型需要 Apple 芯片。"

[[faq.items]]
q = "可以离线使用吗？"
a = "可以，激活并下载好语言包或模型之后就行。只有大模型接口需要联网。"

[[faq.items]]
q = "哪些数据会离开我的 Mac？"
a = "用 Apple 翻译或本地模型时，什么都不会。用大模型接口时，只把识别出的文字发到你设置的地址，从不发送截图。"

[[faq.items]]
q = "可以换别的模型吗？"
a = "可以：在设置里下载 Index-Translate 2B 或 Hy-MT2 1.8B，或填写任意兼容 OpenAI 的接口。密钥保存在钥匙串里。"

[[faq.items]]
q = "能翻译已有的图片吗？"
a = "可以。按 <kbd>⌘O</kbd> 打开，工具完全一样。"

[[faq.items]]
q = "翻译准确吗？"
a = "取决于翻译服务。依赖某个细节之前，按 <kbd>Tab</kbd> 对照一下原文。"

[[faq.items]]
q = "Transeen 开源吗？"
a = "开源，采用 <a href=\"https://github.com/LiuTianjie/Transeen/blob/main/LICENSE\">MIT 许可证</a>。官方应用需要 TR- 激活码。"

[[faq.items]]
q = "怎么更新？"
a = "在菜单栏选择“检查更新…”。"

