[guide.howto]
name = "如何用 Transeen 在 Mac 上截图翻译"
supply = "一个 TR- 激活码"
tools = ["一台 macOS 26 或更高版本的 Mac", "Transeen"]
steps = [
  { name = "安装", text = "从 GitHub Releases 下载 DMG，把 Transeen 拖进“应用程序”并打开。它常驻在菜单栏。" },
  { name = "激活", text = "在菜单栏菜单中选择“激活与账号…”，输入 TR- 激活码，选择“激活这台 Mac”。" },
  { name = "开启屏幕录制", text = "在系统设置 → 隐私与安全性 → 屏幕与系统音频录制中打开 Transeen。" },
  { name = "选择语言", text = "选好原文语言和译文语言，并在设置 → 通用 → 翻译中提前下载需要的 Apple 语言包。" },
  { name = "框选翻译", text = "在任意软件里按 F1 框选屏幕的一部分，在原处读译文。按 Tab 对照原文。" },
]

[[guide.sections]]
id = "install"
title = "安装"
body = """
<ol>
  <li>从 <a href="https://github.com/LiuTianjie/Transeen/releases/latest">GitHub Releases</a> 下载最新的 DMG。大约 {about} MB，一个通用版本同时支持 Apple 芯片和 Intel。</li>
  <li>打开 DMG，把 Transeen 拖进“应用程序”。</li>
  <li>从“应用程序”打开 Transeen。它常驻在菜单栏，不在程序坞里，请在菜单栏找它的图标。</li>
</ol>
<p>应用和 DMG 都用 Developer ID 签名并经过 Apple 公证，macOS 打开时不会弹出警告。同一个发布页还有 ZIP 和 SHA-256 校验值。界面语言跟随系统：简体中文、繁體中文、English、日本語、한국어、Français、Español、Deutsch。</p>
"""

[[guide.sections]]
id = "activate"
title = "激活"
body = """
<ol>
  <li>在菜单栏菜单中选择 <strong>激活与账号…</strong>，或在主窗口中选择 <strong>激活 Transeen</strong>。</li>
  <li>输入激活码，格式是 <code>TR-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX</code>，然后选择 <strong>激活这台 Mac</strong>。无需登录。</li>
  <li>如果愿意，可以用 Google、GitHub 或邮箱登录 iTool 账号并绑定授权。以后登录同一账号即可恢复。</li>
</ol>
<p>激活只在钥匙串里保存一个随机安装 ID 和一份凭证，不读取 Mac 的序列号。一个激活码对应一台 Mac，绑定账号不会多出一份授权。StupidMirror 的 SM- 和 iTool Pro 的 IT- 激活码属于其他产品，在这里不能用。想要激活码，请<a href="https://github.com/LiuTianjie/Transeen/discussions">在 GitHub Discussions 留言</a>。</p>
"""

[[guide.sections]]
id = "permission"
title = "开启屏幕录制"
body = """
<p>第一次截图时，Transeen 会请求屏幕录制权限。它只用屏幕画面，不录音，而且只在你按下截图快捷键时才截取。它不保存历史，也从不持续录屏。</p>
<ol>
  <li>选择 <strong>打开系统设置…</strong>，或前往系统设置 → 隐私与安全性 → 屏幕与系统音频录制。</li>
  <li>找到 Transeen 并打开开关。</li>
  <li>回到 Transeen。它会自动重新检查并显示 <strong>已准备好</strong>，选择 <strong>开始框选</strong> 继续。</li>
</ol>
<p>如果开关已打开但仍不生效，在同一个窗口里点 <strong>重新检查</strong> 或 <strong>重新打开</strong>。</p>
"""

[[guide.sections]]
id = "languages"
title = "选择语言"
body = """
<p>主窗口有两个菜单：<strong>原文语言</strong> 和 <strong>译文语言</strong>。原文可以保持 <strong>自动识别</strong>，也可以从八种语言中选一种：简体中文、繁体中文、英语、日语、韩语、法语、西班牙语、德语。任意两种之间都能互译。</p>
<p>截图打开时，工具下方的方向（例如 JA → ZH）可以改任一边的语言；再按一次 <kbd>F1</kbd> 就交换两边。</p>
<p>Apple 翻译每一对语言都需要语言包。首次启动的引导，以及之后的设置 → 通用 → 翻译，会列出目标语言需要的语言包和状态。点 <strong>下载</strong> 提前装好，第一次截图就不用等；之后翻译完全在本机离线完成。语言包也可以在系统设置 → 通用 → 语言与地区 → 翻译语言中查看。</p>
"""

[[guide.sections]]
id = "translate"
title = "框选翻译"
body = """
<ol>
  <li>在任意软件里按 <kbd>F1</kbd>。屏幕会定格并变暗。在笔记本键盘上是 <kbd>fn</kbd> <kbd>F1</kbd>，除非你把 F 键设成了标准功能键。</li>
  <li>移动指针会自动吸附到段落、输入框或窗口，点一下即可；也可以自己拖一个框，一个框可以跨过几个软件的窗口。<kbd>Esc</kbd> 或右键取消。</li>
  <li>和上次同一个位置？框选时按 <kbd>R</kbd>，直接沿用上一次截图的区域，重启后也有效。</li>
  <li>译文出现在原文所在的位置，逐行翻好逐行显示。按 <kbd>Tab</kbd> 在原文和译文之间切换，按住 <kbd>空格</kbd> 临时看原文。</li>
  <li>少框了一点？拖动截图的边或角。它会从同一张定格画面重新裁切，标注留在原处，松手后重新翻译。</li>
  <li>方向反了？截图打开时再按一次 <kbd>F1</kbd>，两种语言会对调。</li>
</ol>
<p>Transeen 读的是屏幕像素，所以在每个软件里用法都一样，全屏软件和每个桌面也包括在内，打开着的菜单或提示也会留在画面里。<kbd>F1</kbd> 是默认唯一在任何软件里都能用的快捷键。只想截图标注、不翻译，可以在菜单栏菜单中选择 <strong>截图标注</strong>，或在设置 → 快捷键中给它分配一个键；在那个窗口里按 <kbd>T</kbd> 仍可翻译。要翻译已有的图片，选择 <strong>打开图片…</strong> 或按 <kbd>⌘O</kbd>。</p>
"""

[[guide.sections]]
id = "mark"
title = "标注"
body = """
<p>在工具栏选工具，或直接按键：<kbd>R</kbd> 矩形、<kbd>O</kbd> 椭圆、<kbd>A</kbd> 箭头、<kbd>P</kbd> 画笔、<kbd>V</kbd> 选择和移动。绘图工具按下就画，从已有的标注上起笔也一样；要拿起某个标注，用 <kbd>V</kbd>。序号标注从 1 开始递增，撤销和重做后编号不变。</p>
<p>有六种颜色和三种粗细可选，也可以打开滑块选任意颜色和 1 到 10 的线宽。<kbd>⌘Z</kbd> 和 <kbd>⌘⇧Z</kbd> 撤销、重做，<kbd>Delete</kbd> 删除选中的标注。标注在单独的图层上，切换原文和译文时不会移动。</p>
"""

[[guide.sections]]
id = "keep"
title = "复制、保存或钉图"
body = """
<ul>
  <li><kbd>⌘C</kbd> 按你看到的样子复制图片，包括标注，即使译文还在生成也可以。默认复制后会关闭截图；在设置中关掉 <strong>复制后关闭截图</strong> 即可保留。</li>
  <li><kbd>⌘S</kbd> 存成 PNG。</li>
  <li><strong>钉到屏幕</strong> 把图片留在屏幕上，成为一个独立的浮动窗口，同时结束本次截图，马上可以截下一张。钉图会停在你切换到的软件上方，可以拖到任何地方，想留几张都行；右键可复制、保存、切换原文和译文或关闭。</li>
  <li><strong>文字</strong> 打开完整译文，与原文并排，方便复制。</li>
</ul>
"""

[[guide.sections]]
id = "model"
title = "选择翻译服务"
body = """
<p>打开设置（<kbd>⌘,</kbd>）→ 通用 → 翻译，选择 <strong>翻译服务</strong>。文字识别始终在本机完成。</p>
<h3>Apple 本机翻译</h3>
<p>默认选项。使用第 4 步的语言包，离线运行，不向任何地方发送内容。文字每 8 行一组翻译，长截图会边看边填满。</p>
<h3>本地翻译模型</h3>
<p>下载 Index-Translate 2B 或 Hy-MT2 1.8B，每个约 1.1 GB。模型在 Transeen 内部运行，不需要账号、不需要另装应用，也不联网。需要 Apple 芯片的 Mac。首次翻译要几秒钟加载模型，空闲 5 分钟后自动释放内存。<strong>删除模型</strong> 可以再移除它。</p>
<h3>大模型接口</h3>
<p>任何兼容 OpenAI 的 chat/completions 接口。依次填写：</p>
<ul>
  <li><strong>接口地址</strong>，完整 URL，例如 <code>https://api.openai.com/v1/chat/completions</code>；</li>
  <li><strong>模型名称</strong>；</li>
  <li>服务需要时填写 API Key，然后点 <strong>保存密钥</strong>，它会存进钥匙串。<strong>测试连接</strong> 可以检查是否可用。</li>
</ul>
<p>本机上的服务也可以：本地地址可以用 HTTP，也不需要密钥，例如 Ollama 的 <code>http://localhost:11434/v1/chat/completions</code>。远程地址必须用 HTTPS。这种方式只发送识别出的文字，从不发送截图。请求失败时，Transeen 会显示错误并保留原图。</p>
"""

[[guide.sections]]
id = "shortcuts"
title = "键盘快捷键"
body = """
<div class="table-wrap">
  <table class="keys-table">
    <thead><tr><th scope="col">默认按键</th><th scope="col">作用</th></tr></thead>
    <tbody>
      <tr><td><kbd>F1</kbd></td><td>在任意软件里框选区域并翻译</td></tr>
      <tr><td>框选时按 <kbd>R</kbd></td><td>沿用上一次截图的区域</td></tr>
      <tr><td>截图打开时按 <kbd>F1</kbd></td><td>交换语言，或翻译“截图标注”的截图</td></tr>
      <tr><td><kbd>Tab</kbd></td><td>切换原文和译文</td></tr>
      <tr><td>按住 <kbd>空格</kbd></td><td>临时查看原文</td></tr>
      <tr><td><kbd>T</kbd></td><td>翻译或重试</td></tr>
      <tr><td><kbd>D</kbd></td><td>交换语言</td></tr>
      <tr><td><kbd>R</kbd> <kbd>O</kbd> <kbd>A</kbd> <kbd>P</kbd></td><td>矩形、椭圆、箭头、画笔</td></tr>
      <tr><td><kbd>V</kbd></td><td>选择和移动标注</td></tr>
      <tr><td><kbd>⌘C</kbd></td><td>复制图片</td></tr>
      <tr><td><kbd>⌘S</kbd></td><td>存为 PNG</td></tr>
      <tr><td><kbd>⌘Z</kbd> <kbd>⌘⇧Z</kbd></td><td>撤销、重做</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>关闭截图，或取消框选</td></tr>
      <tr><td><kbd>⌘O</kbd></td><td>打开图片</td></tr>
      <tr><td><kbd>⌘,</kbd></td><td>打开设置</td></tr>
    </tbody>
  </table>
</div>
<p>每一项都可以在设置 → 快捷键中修改，<strong>恢复全部默认快捷键</strong> 可以还原。<strong>截图标注</strong> 和 <strong>全局对照原文</strong> 默认没有按键，需要在那里设置。全局快捷键需要搭配 <kbd>⌘</kbd>、<kbd>⌥</kbd> 或 <kbd>⌃</kbd>，也可以用 F 功能键。</p>
"""

[[guide.sections]]
id = "troubleshooting"
title = "常见问题排查"
body = """
<h3>按 F1 没有反应</h3>
<p>在笔记本键盘上，F1 默认调节亮度，需要按住 <kbd>fn</kbd>，或在系统设置 → 键盘 → 键盘快捷键 → 功能键中打开“将 F1、F2 等键用作标准功能键”。也可能是其他软件占用了 F1，Transeen 无法注册快捷键时会提示你。可以在设置 → 快捷键中换一个键，或从菜单栏菜单的 <strong>截图翻译</strong> 开始。</p>
<h3>截图是空的，或一直提示授权</h3>
<p>打开菜单栏菜单中的 <strong>屏幕权限…</strong>。如果系统设置里 Transeen 已经是打开的，先关掉再打开，然后选择 <strong>重新打开</strong>。</p>
<h3>窗口有一块是黑的</h3>
<p>有些软件会禁止录屏，保护视频等内容，这部分在任何截图里都是黑色。Transeen 读不到也翻译不了这部分，框里的其他内容照常翻译。</p>
<h3>Apple 翻译没有开始</h3>
<p>这对语言的语言包可能没有下载或还在下载。在设置 → 通用 → 翻译中下载，或到系统设置 → 通用 → 语言与地区 → 翻译语言中查看，然后再试一次。</p>
<h3>本地模型启动不了</h3>
<p>先重试一次。仍不行的话，在设置 → 通用 → 翻译中删除模型后重新下载；校验失败的下载会被自动删除。</p>
<h3>部分文字翻译不对</h3>
<p>密集排版、公式和专业术语可能让识别或翻译出错。按 <kbd>Tab</kbd> 对照原文，打开 <strong>文字</strong> 查看完整译文，或框选更小的区域。</p>
"""

[[guide.sections]]
id = "build"
title = "从源码构建"
body = """
<p>Transeen 以 <a href="https://github.com/LiuTianjie/Transeen/blob/main/LICENSE">MIT 许可证</a>开源。需要 Xcode 26.4 或更高版本、Swift 6 和 XcodeGen。</p>
<pre><code>brew install xcodegen
git clone https://github.com/LiuTianjie/Transeen.git
cd Transeen
./scripts/build.sh</code></pre>
<p>应用会生成在 <code>dist/Transeen.app</code>。没有 Developer ID 证书时使用临时签名；设置 <code>TRANSEEN_SIGNING_IDENTITY</code> 可生成正式签名的版本。测试脚本是 <code>./scripts/test.sh</code>、<code>./scripts/test-license.sh</code> 和 <code>./scripts/test-lifecycle.sh</code>。托管的激活服务只属于官方版本，独立分发需要自己的授权后端。</p>
"""
