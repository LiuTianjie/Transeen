[guide]
name = "使用指南"
title = "五步装好 Transeen，<span>然后按 F1。</span>"
lead = "从下载到第一次截图翻译。你需要一台 macOS 26 或更高版本的 Mac，和一个 TR- 激活码。"
all_shortcuts = "全部快捷键"
