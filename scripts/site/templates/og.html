<!doctype html>
<html lang="en" data-still>
  <head>
    <meta charset="utf-8" />
    <!-- Written by scripts/site/build.py from templates/og.html and rendered by
         scripts/render-og.sh. ?lang=<code> for each language; ?shot draws the bare demo window for
         the README screenshot instead of the 1200 × 630 share card. -->
    <link rel="stylesheet" href="../../docs/assets/site.css" />
    <style>
      *, *::before, *::after { transition: none !important; animation: none !important; }
      html, body { margin: 0; overflow: hidden; background: var(--bg); }
      .share { box-sizing: border-box; position: relative; width: 1200px; height: 630px; padding: 64px 72px; overflow: hidden; }
      .share::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 70% at 85% 30%, rgba(120, 140, 200, 0.14), transparent 70%); }
      .share .brand { font-size: 22px; gap: 12px; }
      .share .brand img { width: 34px; height: 34px; border-radius: 9px; }
      .share h1 { position: relative; z-index: 1; width: 440px; margin-top: 110px; font-size: 66px; font-weight: 560; line-height: 1; letter-spacing: -0.045em; }
      .share h1 span { display: block; color: var(--fg-2); }
      .share h1 b { font-weight: inherit; }
      :is(:lang(zh), :lang(ja), :lang(ko)) .share h1 b, :is(:lang(zh), :lang(ja), :lang(ko)) .share h1 span { display: inline-block; }
      :is(:lang(zh), :lang(ja), :lang(ko)) .share h1 { font-size: 60px; line-height: 1.16; letter-spacing: -0.02em; }
      :is(:lang(fr), :lang(es)) .share h1 { font-size: 58px; }
      :lang(de) .share h1 { font-size: 50px; }
      .share h1 .nb { white-space: nowrap; }
      .share .meta { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 22px; align-items: center; color: var(--fg-3); font: 15px/1 var(--mono); letter-spacing: 0.02em; }
      .share .meta kbd { padding: 8px 12px; font-size: 16px; }
      .share .stage { position: absolute; left: 500px; top: 120px; width: 680px; }
      .share .demo .window { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 40px 120px -30px rgba(0, 0, 0, 0.9); }
      .shot { width: 1000px; padding: 0; }
    </style>
  </head>
  <body>
    <!-- part:sprite -->
    <!-- /part:sprite -->
    <div class="share" id="card">
      <span class="brand"><img src="../../docs/assets/app-icon.png" alt="" />Transeen</span>
      <h1 id="title">Translate your screen, <span>in place.</span></h1>
      <p class="meta"><kbd>F1</kbd><span>macOS 26+</span><span>transeen.itool.tech</span></p>
      <div class="stage" id="stage">
        <div class="demo">
          <div class="demo-viewport">
            <!-- part:demo -->
            <!-- /part:demo -->
          </div>
        </div>
      </div>
    </div>
    <script>
      // Each language's share card: ?lang=<code> sets the page language and the title.
      const titles = {titles};
      const query = new URLSearchParams(location.search);
      const chosen = titles[query.get("lang")];
      if (chosen) {
        document.documentElement.lang = chosen[0];
        document.getElementById("title").innerHTML = chosen[1];
      }
      if (query.has("shot")) {
        const card = document.getElementById("card");
        const stage = document.getElementById("stage");
        stage.className = "shot";
        card.replaceWith(stage);
      }
    </script>
    <script src="../../docs/assets/site.js"></script>
  </body>
</html>
