# Facts every page shares. scripts/site/build.py reads this with the strings in locales/.

origin = "https://transeen.itool.tech"
version = "0.11.2"
# The day this version came out, the day the pages last changed, and the site's first day.
released = 2026-10-31
modified = 2026-10-31
published = 2026-10-28
# The DMG on the release page, in megabytes: exact for structured data, rounded for prose.
size_mb = "10.4"
size_about = "10"
download = "https://github.com/LiuTianjie/Transeen/releases/latest"
repository = "https://github.com/LiuTianjie/Transeen"

# The two newest releases, shown on the home pages. Each language has their notes.
[[release]]
version = "0.11.2"
date = 2026-10-31

[[release]]
version = "0.11.1"
date = 2026-10-30

# Every language the site is written in, in the order menus list them. dir is the folder under
# docs/, lang the page's lang attribute, hreflang the values search engines see for it, og the
# Open Graph locale, and suffix names its share image and screenshot (og-image<suffix>.jpg).
[[locale]]
code = "en"
dir = ""
lang = "en"
hreflang = ["en"]
og = "en_US"
name = "English"
suffix = ""

[[locale]]
code = "zh-Hans"
dir = "zh"
lang = "zh-CN"
hreflang = ["zh-Hans", "zh-CN", "zh"]
og = "zh_CN"
name = "简体中文"
suffix = "-zh"
baidu = true

[[locale]]
code = "zh-Hant"
dir = "zh-hant"
lang = "zh-Hant"
hreflang = ["zh-Hant", "zh-TW", "zh-HK"]
og = "zh_TW"
name = "繁體中文"
suffix = "-zh-hant"

[[locale]]
code = "ja"
dir = "ja"
lang = "ja"
hreflang = ["ja"]
og = "ja_JP"
name = "日本語"
suffix = "-ja"

[[locale]]
code = "ko"
dir = "ko"
lang = "ko"
hreflang = ["ko"]
og = "ko_KR"
name = "한국어"
suffix = "-ko"

[[locale]]
code = "fr"
dir = "fr"
lang = "fr"
hreflang = ["fr"]
og = "fr_FR"
name = "Français"
suffix = "-fr"

[[locale]]
code = "es"
dir = "es"
lang = "es"
hreflang = ["es"]
og = "es_ES"
name = "Español"
suffix = "-es"

[[locale]]
code = "de"
dir = "de"
lang = "de"
hreflang = ["de"]
og = "de_DE"
name = "Deutsch"
suffix = "-de"
